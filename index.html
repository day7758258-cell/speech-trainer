    const moveGroupSelect    = document.getElementById("moveGroupSelect");
    const moveGroupModalClose= document.getElementById("moveGroupModalClose");
    const moveGroupCancel    = document.getElementById("moveGroupCancel");
    const moveGroupConfirm   = document.getElementById("moveGroupConfirm");

    /* ─── State ─── */
    let topics = [];
    let groups = [];           // [{ id, name }]
    let interval = null;
    let totalSeconds = 180;
    let remaining = 180;
    let lastTopicId = null;
    let currentTopicId = null;
    let selectedIds = new Set();
    let editingId = null;
    let timerState = "idle";
    let audioCtx = null;

    /* 分组弹窗的工作模式：'create' | 'rename' */
    let groupModalMode = 'create';
    let groupModalTargetId = null;

    /* 待执行的上传 / 移动操作暂存 */
    let pendingUploadItems = null;       // [{ text }]
    let pendingUploadExt = null;         // 文件后缀
    let pendingMoveIds = null;           // Set<topicId>

    /* 抽题范围状态：{ type: 'all' | 'ungrouped' | 'group', groupId?: string } */
    let trainingScope = { type: 'all' };

    /* 分组折叠状态：{ [scopeKey]: boolean }  true=折叠 */
    let groupCollapseMap = {};

    /* ─── Audio · 预热 + 柔和音 ─── */
    let audioReady = false;

    function getAudioCtx() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {}
      }
      return audioCtx;
    }

    /**
     * 用户首次手势后预热 AudioContext + 静音播放一段
     * 后续音效可零延迟触发，避免首次卡顿
     */
    function warmUpAudio() {
      const ctx = getAudioCtx();
      if (!ctx || audioReady) return;
      try {
        if (ctx.state === 'suspended') ctx.resume();
        // 静音 warm-up：构造一个极短、几乎听不见的 oscillator
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = 220;
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.01);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.02);
        audioReady = true;
        if (window.__appCaps) window.__appCaps.audio = true;
      } catch (e) {
        try { console.error('[audio] warmUp failed:', e); } catch (_) {}
      }
    }

    // 任何用户手势都触发一次预热（独立 try 包裹，避免影响页面初始化）
    try {
      ['touchstart', 'mousedown', 'keydown'].forEach(function (evt) {
        window.addEventListener(evt, warmUpAudio, { once: true, passive: true });
      });
    } catch (e) {
      try { console.error('[audio] register warmup listeners:', e); } catch (_) {}
    }

    /**
     * 柔和敲击音：木质 tock，三角波 380→120 Hz
     * 限频：高频段音量降到 60% 避免刺耳
     */
    function playClick(vol = 0.16, pitchScale = 1) {
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(380 * pitchScale, now);
        osc.frequency.exponentialRampToValueAtTime(120 * pitchScale, now + 0.06);
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.1);
      } catch (_) {}
    }

    /**
     * 揭晓音：柔和的 "pop"
     *   - 一个 350 → 180 Hz 的快速滑落三角波
     *   - 短促包络（80ms），音量克制
     */
    function playRevealSound() {
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(220, now + 0.18);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.16, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
        osc.start(now);
        osc.stop(now + 0.35);
      } catch (_) {}
    }

    /**
     * 开箱音：钟声和弦 C-E-G + 轻微谐波，不刺耳
     */
    function playOpenSound() {
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        // 主音：C-E-G 大三和弦
        [261.63, 329.63, 392.00].forEach(function (freq, i) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0, now + i * 0.08);
          gain.gain.linearRampToValueAtTime(0.18, now + i * 0.08 + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.5);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.55);
        });
        // 高谐波（音量低），增加钟质感
        [523.25, 659.25].forEach(function (freq, i) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0, now + 0.06 + i * 0.08);
          gain.gain.linearRampToValueAtTime(0.06, now + 0.06 + i * 0.08 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06 + i * 0.08 + 0.28);
          osc.start(now + 0.06 + i * 0.08);
          osc.stop(now + 0.06 + i * 0.08 + 0.32);
        });
      } catch (_) {}
    }

    /**
     * 计时结束音：柔和双音 C-G
     */
    function playBeep() {
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        [523.25, 783.99].forEach(function (freq, i) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0, now + i * 0.22);
          gain.gain.linearRampToValueAtTime(0.18, now + i * 0.22 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.22 + 0.42);
          osc.start(now + i * 0.22);
          osc.stop(now + i * 0.22 + 0.45);
        });
      } catch (_) {}
    }

    /* ─── Helpers ─── */
    function generateId() {
      return "t_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function loadTopics() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try {
            const p = JSON.parse(saved);
            if (Array.isArray(p) && p.length > 0) return p;
          } catch (_) {}
        }
      } catch (e) { console.error('[storage] read topics:', e); }
      const seeded = DEFAULT_TOPICS.map((t, i) => ({ id: "d" + i, ...t }));
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(seeded)); } catch (_) {}
      return seeded;
    }

    function saveTopics() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(topics)); } catch (e) { console.error('[storage] save topics:', e); } }

    function loadDuration() {
      try {
        const s = localStorage.getItem(TIME_KEY);
        const n = parseInt(s, 10);
        if (s == null || isNaN(n) || n < 1) return 180; // 默认 3 分钟 = 180 秒
        // 旧版本以"分钟"存储（1~99）；新版本以"秒"存储（>= 1）。
        // 兼容策略：以 99（含）作为分钟上限判定：原值 ≤ 99 且在没有明显"秒特征"时，按分钟换算。
        // 由于新版本可能存 30秒 / 90秒 / 3600秒 等，30 也会被误判为 30 分钟。
        // 这里采用一次性迁移：若值 ≤ 99，认为是旧版分钟数；若 > 99，认为是新版秒数。
        if (n <= 99) return n * 60;
        if (n <= 6000) return n;        // 100~6000 秒：直接当作秒数（新格式）
        return 180;                    // 异常容错
      } catch (e) {
        console.error('[storage] read duration:', e);
        return 180;
      }
    }

    function saveDuration(sec) {
      try { localStorage.setItem(TIME_KEY, String(sec)); } catch (_) {}
    }

    /* ─── Groups · 自定义分组系统 ─── */

    /** 安全读取 LocalStorage 的 JSON */
    function safeParse(raw, fallback) {
      if (raw == null) return fallback;
      try { return JSON.parse(raw); } catch (e) {
        try { console.error('[storage] JSON.parse:', e); } catch (_) {}
        return fallback;
      }
    }

    function safeGet(key, fallback) {
      try {
        if (!window.__appCaps || !window.__appCaps.storage) return fallback;
        return safeParse(localStorage.getItem(key), fallback);
      } catch (e) {
        try { console.error('[storage] get:', key, e); } catch (_) {}
        return fallback;
      }
    }

    function safeSet(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); return true; }
      catch (_) { return false; }
    }

    /** 生成分组唯一 id */
    function generateGroupId() {
      return 'g_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    /** 读取分组列表（保证是数组且元素结构合法） */
    function loadGroups() {
      const raw = safeGet(GROUP_STORAGE_KEY, []);
      if (!Array.isArray(raw)) return [];
      return raw
        .filter(function (g) { return g && typeof g.id === 'string' && typeof g.name === 'string'; })
        .map(function (g) { return { id: g.id, name: g.name }; });
    }

    function saveGroups() { safeSet(GROUP_STORAGE_KEY, groups); }

    /** 分组重名校验（忽略自己） */
    function isGroupNameTaken(name, exceptId) {
      const trimmed = String(name || '').trim();
      return groups.some(function (g) {
        return g.name === trimmed && g.id !== exceptId;
      });
    }

    /** 创建分组 */
    function createGroup(name) {
      try {
        const trimmed = String(name || '').trim();
        if (!trimmed) return { ok: false, msg: '分组名称不能为空' };
        if (isGroupNameTaken(trimmed)) return { ok: false, msg: '已存在同名分组' };
        const g = { id: generateGroupId(), name: trimmed };
        groups.push(g);
        saveGroups();
        try { renderScopePill(); } catch (e) { console.error('[group] scopePill:', e); }
        return { ok: true, group: g };
      } catch (e) {
        try { console.error('[group] createGroup:', e); } catch (_) {}
        return { ok: false, msg: '创建失败' };
      }
    }

    /** 重命名分组 */
    function renameGroup(id, newName) {
      try {
        const trimmed = String(newName || '').trim();
        if (!trimmed) return { ok: false, msg: '分组名称不能为空' };
        const g = groups.find(function (x) { return x.id === id; });
        if (!g) return { ok: false, msg: '分组不存在' };
        if (isGroupNameTaken(trimmed, id)) return { ok: false, msg: '已存在同名分组' };
        g.name = trimmed;
        saveGroups();
        try { renderScopePill(); } catch (e) { console.error('[group] scopePill:', e); }
        return { ok: true };
      } catch (e) {
        try { console.error('[group] renameGroup:', e); } catch (_) {}
        return { ok: false, msg: '重命名失败' };
      }
    }

    /**
     * 删除分组：该分组内的所有话题 groupId = null（自动进入未分组）
     * 分组本身被移除；话题不会被删除。
     */
    function deleteGroup(id) {
      try {
        const idx = groups.findIndex(function (g) { return g.id === id; });
        if (idx < 0) return { ok: false, msg: '分组不存在' };
        const removedName = groups[idx].name;
        groups.splice(idx, 1);
        saveGroups();

        let moved = 0;
        (topics || []).forEach(function (t) {
          if (t && t.groupId === id) {
            t.groupId = null;
            moved++;
          }
        });
        if (moved > 0) saveTopics();

        // 同步删除折叠状态
        try { removeCollapse({ kind: 'group', groupId: id }); } catch (_) {}

        // 同步主页面抽题范围：如果正选中这个被删除的分组，则回退到全部挑战
        if (trainingScope && trainingScope.type === 'group' && trainingScope.groupId === id) {
          try { setTrainingScope({ type: 'all' }); } catch (_) {}
        }

        return { ok: true, movedCount: moved, removedName: removedName };
      } catch (e) {
        try { console.error('[group] deleteGroup:', e); } catch (_) {}
        return { ok: false, msg: '删除失败' };
      }
    }

    /** 把一组话题移动到指定分组（groupId === null 表示未分组） */
    function moveTopicsToGroup(topicIds, groupId) {
      try {
        const ids = topicIds instanceof Set ? topicIds : new Set(topicIds);
        if (!ids.size) return { ok: false, count: 0 };
        let count = 0;
        (topics || []).forEach(function (t) {
          if (t && ids.has(t.id)) {
            t.groupId = groupId || null;
            count++;
          }
        });
        if (count > 0) saveTopics();
        return { ok: true, count: count };
      } catch (e) {
        try { console.error('[group] moveTopicsToGroup:', e); } catch (_) {}
        return { ok: false, count: 0 };
      }
    }

    /** 获取话题所属分组的展示名（用于卡片 tag） */
    function getTopicGroupLabel(item) {
      if (!item) return '';
      if (item.groupId == null) return '未分组';
      const g = groups.find(function (x) { return x.id === item.groupId; });
      return g ? g.name : '未分组';
    }

    /**
     * 迁移旧话题：把 cat 字段全部改为 groupId: null，并写回 LocalStorage。
     * 通过 MIGRATION_FLAG 保证只执行一次。
     */
    function migrateOldTopics() {
      try {
        // storage 不可用（隐私模式 / 异常）则跳过迁移
        if (!window.__appCaps || !window.__appCaps.storage) {
          localStorage.setItem(MIGRATION_FLAG, '1'); // 仍标记，但安全失败不抛
          return;
        }
        if (localStorage.getItem(MIGRATION_FLAG) === '1') return;

        // 1) 迁移话题
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = safeParse(raw, null);
          if (Array.isArray(parsed)) {
            let changed = false;
            parsed.forEach(function (t) {
              if (!t || typeof t.text !== 'string') return;
              if (Object.prototype.hasOwnProperty.call(t, 'cat')) {
                delete t.cat;
                changed = true;
              }
              if (!('groupId' in t)) {
                t.groupId = null;
                changed = true;
              }
            });
            if (changed) safeSet(STORAGE_KEY, parsed);
          }
        }

        // 2) 初始化分组容器（如果还没有）
        if (!localStorage.getItem(GROUP_STORAGE_KEY)) {
          safeSet(GROUP_STORAGE_KEY, []);
        }

        localStorage.setItem(MIGRATION_FLAG, '1');
      } catch (e) { console.warn('[migrate] failed', e); }
    }

    /* ─── Training Scope（抽题范围） ─── */

    /** 默认值 */
    function defaultScope() { return { type: 'all' }; }

    function loadTrainingScope() {
      const obj = safeGet(SCOPE_KEY, null);
      if (!obj || typeof obj !== 'object') return defaultScope();
      if (obj.type === 'all' || obj.type === 'ungrouped') return { type: obj.type };
      if (obj.type === 'group' && typeof obj.groupId === 'string') return { type: 'group', groupId: obj.groupId };
      return defaultScope();
    }

    function saveTrainingScope() {
      safeSet(SCOPE_KEY, trainingScope);
    }

    /** 校验并修正 scope（删除分组时调用） */
    function validateScope() {
      if (trainingScope.type === 'group') {
        const exists = groups.some(function (g) { return g.id === trainingScope.groupId; });
        if (!exists) {
          trainingScope = defaultScope();
          saveTrainingScope();
        }
      }
    }

    /** 根据当前 scope 得到候选话题数组 */
    function getScopedTopics() {
      if (trainingScope.type === 'ungrouped') {
        return topics.filter(function (t) { return t && t.groupId == null; });
      }
      if (trainingScope.type === 'group') {
        return topics.filter(function (t) { return t && t.groupId === trainingScope.groupId; });
      }
      // 'all'
      return topics.slice();
    }

    /** scope 显示名 */
    function getScopeLabel() {
      if (trainingScope.type === 'ungrouped') return '未分组';
      if (trainingScope.type === 'group') {
        const g = groups.find(function (x) { return x.id === trainingScope.groupId; });
        return g ? g.name : '全部挑战';
      }
      return '全部挑战';
    }

    function setTrainingScope(next) {
      try {
        trainingScope = next;
        saveTrainingScope();
        renderScopePill();
        renderScopeMenu();
        renderSlotBadge();
      } catch (e) { try { console.error('[scope] setTrainingScope:', e); } catch (_) {} }
    }

    function renderScopePill() {
      try { if (scopePillText) scopePillText.textContent = getScopeLabel(); }
      catch (e) { try { console.error('[render] scopePill:', e); } catch (_) {} }
    }

    /**
     * 渲染热区左上角的内嵌分类标签。
     * · 只修改 slotBadge.textContent（永不创建新元素，不会叠加）
     * · scope = 'all' 时隐藏；其他情况显示当前 scope 名称
     * · 已抽取题目后，题目固定在 currentTopicId，但标签跟随 scope 切换实时更新
     */
    function renderSlotBadge() {
      if (!slotBadge) return;
      const label = getScopeLabel();
      if (label === '全部挑战') {
        slotBadge.classList.remove('show');
      } else {
        slotBadge.textContent = label;
        slotBadge.classList.add('show');
      }
    }

    function buildScopeMenuItems() {
      const items = [];

      // 1) 全部挑战（始终在最上）
      items.push({
        key: 'all',
        type: 'all',
        name: '全部挑战',
        count: topics.length
      });

      items.push({ type: 'separator' });

      // 2) 未分组
      const ungroupedCount = topics.filter(function (t) { return t && t.groupId == null; }).length;
      items.push({
        key: 'ungrouped',
        type: 'ungrouped',
        name: '未分组',
        count: ungroupedCount
      });

      if (groups.length) items.push({ type: 'separator' });

      // 3) 用户自定义分组
      groups.forEach(function (g) {
        const c = topics.filter(function (t) { return t && t.groupId === g.id; }).length;
        items.push({
          key: 'g:' + g.id,
          type: 'group',
          groupId: g.id,
          name: g.name,
          count: c
        });
      });

      if (!groups.length && !ungroupedCount) {
        items.push({ type: 'empty', name: '暂无挑战' });
      }
      return items;
    }

    function renderScopeMenu() {
      if (!scopeMenu) return;
      const items = buildScopeMenuItems();
      scopeMenu.innerHTML = '';
      let activeKey = trainingScope.type;
      if (trainingScope.type === 'group') activeKey = 'g:' + trainingScope.groupId;

      items.forEach(function (it) {
        if (it.type === 'separator') {
          const s = document.createElement('div');
          s.className = 'scope-separator';
          scopeMenu.appendChild(s);
          return;
        }
        if (it.type === 'empty') {
          const e = document.createElement('div');
          e.className = 'scope-empty';
          e.textContent = it.name;
          scopeMenu.appendChild(e);
          return;
        }
        const row = document.createElement('div');
        row.className = 'scope-item';
        row.dataset.key = it.key;
        const myKey = it.type === 'group' ? 'g:' + it.groupId : it.type;
        if (myKey === activeKey) row.classList.add('active');
        const check = document.createElement('span');
        check.className = 'scope-check';
        check.textContent = myKey === activeKey ? '✓' : '';
        const name = document.createElement('span');
        name.className = 'scope-name';
        name.textContent = it.name;
        const cnt = document.createElement('span');
        cnt.className = 'scope-count';
        cnt.textContent = String(it.count);
        row.append(check, name, cnt);
        safeOn(row, 'click', function () {
          if (it.type === 'all')         setTrainingScope({ type: 'all' });
          else if (it.type === 'ungrouped') setTrainingScope({ type: 'ungrouped' });
          else if (it.type === 'group')     setTrainingScope({ type: 'group', groupId: it.groupId });
          closeScopeMenu();
        });
        if (scopeMenu) scopeMenu.appendChild(row);
      });
    }

    function openScopeMenu() {
      try {
        renderScopeMenu();
        if (scopeMenu) scopeMenu.classList.add('open');
        if (scopePill) scopePill.classList.add('open');
      } catch (e) { try { console.error('[scope] openScopeMenu:', e); } catch (_) {} }
    }

    function closeScopeMenu() {
      try {
        if (scopeMenu) scopeMenu.classList.remove('open');
        if (scopePill) scopePill.classList.remove('open');
      } catch (_) {}
    }

    function toggleScopeMenu() {
      try {
        if (!scopeMenu) return;
        if (scopeMenu.classList.contains('open')) closeScopeMenu();
        else openScopeMenu();
      } catch (_) {}
    }

    /* ─── Group Collapse（分组折叠） ─── */

    function scopeKeyOf(section) {
      // section = { kind: 'ungrouped' } | { kind: 'group', groupId: '...' }
      return section.kind === 'group' ? ('g:' + section.groupId) : section.kind;
    }

    function loadCollapseMap() {
      const obj = safeGet(COLLAPSE_KEY, {});
      return (obj && typeof obj === 'object') ? obj : {};
    }

    function saveCollapseMap() { safeSet(COLLAPSE_KEY, groupCollapseMap); }

    function isCollapsed(section) {
      return !!groupCollapseMap[scopeKeyOf(section)];
    }

    function setCollapsed(section, val) {
      const k = scopeKeyOf(section);
      if (val) groupCollapseMap[k] = true;
      else delete groupCollapseMap[k];
      saveCollapseMap();
    }

    function removeCollapse(section) {
      const k = scopeKeyOf(section);
      if (k in groupCollapseMap) {
        delete groupCollapseMap[k];
        saveCollapseMap();
      }
    }

    function showToast(msg) {
      try {
        if (!toastEl) return;
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(function () { try { toastEl.classList.remove("show"); } catch (_) {} }, 2400);
      } catch (e) { try { console.error('[toast]:', e); } catch (_) {} }
    }

    function formatTime(sec) {
      sec = Math.max(0, Math.floor(sec));
      if (sec >= 3600) {
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = sec % 60;
        return (
          String(h).padStart(2, "0") + ":" +
          String(m).padStart(2, "0") + ":" +
          String(s).padStart(2, "0")
        );
      }
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    }

    function pickTopic() {
      // 优先从当前抽题范围的候选池中选
      const pool = slotPool && slotPool.length ? slotPool : getScopedTopics();
      if (!pool.length) return null;
      let pick;
      do {
        pick = pool[Math.floor(Math.random() * pool.length)];
      } while (pick && pick.id === lastTopicId && pool.length > 1);
      lastTopicId = pick.id;
      return pick;
    }

    function showTopic(item) {
      try {
        if (!item) return;
        currentTopicId = item.id;
        lastTopicId = item.id;

        // 强制写入 A 层
        const topicA = document.querySelector('#slotA .topic');
        if (topicA) {
          topicA.textContent = item.text;
          topicA.classList.remove("empty", "blur", "ghost");
        }

        // 同步 slot 双层结构，复位到 A 层
        try {
          const slotA = document.getElementById('slotA');
          const slotB = document.getElementById('slotB');
          if (slotA) slotA.classList.add('visible');
          if (slotB) {
            slotB.classList.remove('visible');
            const topicB = slotB.querySelector('.topic');
            if (topicB) topicB.textContent = '';
          }
          slotCurrentLayer = 'A';
        } catch (_) {}

        if (modal && modal.classList && modal.classList.contains("open")) { try { renderModalList(); } catch (_) {} }
        try { syncUiState(); } catch (e) { console.error('[ui] syncUiState:', e); }
      } catch (e) { try { console.error('[ui] showTopic:', e); } catch (_) {} }
    }

    /* ─── Daily Train Count · 今日训练次数 ───
       规则：
       · 完成一次训练（计时归零）才算一次；抽题不算
       · 计数按本地自然日（YYYY-MM-DD）切换，跨日自动重置
       · localStorage 持久化，刷新或重启不丢
    */
    function _todayKey() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function loadDailyCount() {
      try {
        if (!window.__appCaps || !window.__appCaps.storage) return 0;
        const savedDate = localStorage.getItem(COUNT_DATE_KEY);
        const today = _todayKey();
        if (savedDate !== today) {
          // 跨日或首次访问：归零
          try { localStorage.setItem(COUNT_DATE_KEY, today); } catch (_) {}
          try { localStorage.setItem(COUNT_KEY, "0"); } catch (_) {}
          return 0;
        }
        const raw = localStorage.getItem(COUNT_KEY);
        const n = parseInt(raw || "0", 10);
        return Number.isFinite(n) && n >= 0 ? n : 0;
      } catch (e) {
        try { console.error('[storage] loadDailyCount:', e); } catch (_) {}
        return 0;
      }
    }

    function saveDailyCount(n) {
      try {
        localStorage.setItem(COUNT_KEY, String(n));
        localStorage.setItem(COUNT_DATE_KEY, _todayKey());
      } catch (_) {}
    }

    function incrementDailyCount() {
      const n = loadDailyCount() + 1;
      saveDailyCount(n);
      renderTrainCount(n, true);
      return n;
    }

    function renderTrainCount(n, animate) {
      try {
        if (!trainCountEl) return;
        trainCountEl.textContent = String(n);
        if (animate) {
          const wrap = trainCountEl.closest(".train-counter");
          if (wrap) {
            wrap.classList.remove("bump");
            // eslint-disable-next-line no-unused-expressions
            wrap.offsetWidth;
            wrap.classList.add("bump");
            setTimeout(function () { try { wrap.classList.remove("bump"); } catch (_) {} }, 360);
          }
        }
      } catch (e) { try { console.error('[ui] renderTrainCount:', e); } catch (_) {} }
    }

    /* ─── Timer ─── */
    function onTimerDone() {
      try {
        timerState = "done";
        if (timerEl) {
          timerEl.classList.add("done");
          timerEl.classList.remove("inactive", "running");
        }
        if (progressEl) progressEl.classList.add("done");
        try { playBeep(); } catch (e) { console.error('[audio] beep:', e); }

        // 训练完成 → 计数 +1
        let newCount = 0;
        try { newCount = incrementDailyCount(); } catch (e) { console.error('[counter] increment:', e); }

        // 请求浏览器通知（首次会弹权限；显式调用以保证权限流程明确）
        try { tryRequestNotificationPermission(); } catch (e) { console.error('[notify] requestPermission:', e); }

        // 浏览器通知
        if ("Notification" in window && Notification.permission === "granted") {
          try {
            new Notification("B. Challenge", { body: `完成了一次挑战 · 今日已训练 ${newCount} 次` });
          } catch (e) { try { console.error('[notify] post:', e); } catch (_) {} }
        }

        try { updateControls(); } catch (e) { console.error('[controls] updateControls:', e); }
        try { syncUiState(); } catch (e) { console.error('[ui] syncUiState:', e); }
      } catch (e) { try { console.error('[timer] onTimerDone:', e); } catch (_) {} }
    }

    /**
     * 主动请求通知权限（非 granted / 非 denied 时调用）。
     * 满足现代浏览器的"用户手势期间调用"要求 —— 由调用栈确保（onTimerDone 仅在用户点击开始后才会触发）。
     */
    function tryRequestNotificationPermission() {
      try {
        if (!("Notification" in window)) return;
        if (typeof Notification === 'undefined') return;
        if (!Notification || Notification.permission !== "default") return;
        try {
          Notification.requestPermission().then(function () {}).catch(function (e) { try { console.error('[notify] permission:', e); } catch (_) {} });
        } catch (_) {}
      } catch (_) {}
    }

    function stopTimer() {
      try { if (interval) { clearInterval(interval); interval = null; } } catch (_) {}
    }

    /**
     * 根据当前 timerState / currentTopicId 同步主 UI：
     *   - 主按钮文字
     *   - 状态条
     *   - 计时器可见度
     *   - 卡片高亮
     *   - 抽题按钮文字
     */
    function updateControls() {
      try {
        const running = timerState === "running";
        const paused  = timerState === "paused";
        const done    = timerState === "done";
        const idle    = timerState === "idle";

        const icon = btnPlay && btnPlay.querySelector ? btnPlay.querySelector('.btn-primary-icon') : null;

        // 主按钮文字
        if (running) {
          if (icon) icon.textContent = '⏸';
          if (btnPlayLabel) btnPlayLabel.textContent = '暂停';
          if (btnPlay) btnPlay.dataset.mode = 'pause';
        } else if (paused) {
          if (icon) icon.textContent = '▶';
          if (btnPlayLabel) btnPlayLabel.textContent = '继续';
          if (btnPlay) btnPlay.dataset.mode = 'resume';
        } else if (done) {
          if (icon) icon.textContent = '🔁';
          if (btnPlayLabel) btnPlayLabel.textContent = '再来一次';
          if (btnPlay) btnPlay.dataset.mode = 'restart';
        } else {
          if (icon) icon.textContent = '▶';
          if (btnPlayLabel) btnPlayLabel.textContent = '开始吧';
          if (btnPlay) btnPlay.dataset.mode = 'start';
        }

        // 时间输入禁用（运行/暂停时不允许改）
        try { syncCustomDurationLock(); } catch (e) { console.error('[controls] syncCustomDurationLock:', e); }

        // 重置按钮 dimmed
        if (btnReset) btnReset.classList.toggle('dimmed', idle || done);

        // 计时器状态色
        if (timerEl) timerEl.classList.toggle('running', running);
      } catch (e) { try { console.error('[controls] updateControls:', e); } catch (_) {} }
    }

    function startTimer() {
      try {
        stopTimer();
        timerState = "running";
        if (progressEl) {
          progressEl.className = "progress-fill";
          progressEl.style.width = "0%";
        }
        try { updateControls(); } catch (e) { console.error('[controls] updateControls:', e); }
        interval = setInterval(function () {
          try {
            remaining--;
            if (timerEl) timerEl.textContent = formatTime(remaining);
            if (progressEl) {
              const pct = (totalSeconds - remaining) / totalSeconds * 100;
              progressEl.style.width = pct + "%";
              if (pct > 80) progressEl.classList.add("almost");
            }
            if (remaining <= 0) { stopTimer(); onTimerDone(); }
          } catch (e) {
            try { console.error('[timer] tick:', e); } catch (_) {}
          }
        }, 1000);
      } catch (e) { try { console.error('[timer] startTimer:', e); } catch (_) {} }
    }

    function pauseTimer() {
      try { stopTimer(); timerState = "paused"; } catch (e) { console.error('[timer] pause:', e); }
      try { updateControls(); } catch (e) { console.error('[controls]:', e); }
      try { syncUiState(); } catch (e) { console.error('[ui]:', e); }
    }

    function resetTimer() {
      try { stopTimer(); } catch (e) { console.error('[timer] stopTimer:', e); }
      try {
        timerState = "idle";
        remaining = totalSeconds;
        if (timerEl) {
          timerEl.textContent = formatTime(totalSeconds);
          timerEl.classList.remove("done", "running");
        }
        if (progressEl) {
          progressEl.style.width = "0%";
          progressEl.className = "progress-fill";
        }
      } catch (e) { try { console.error('[timer] reset state:', e); } catch (_) {} }
      try { updateControls(); } catch (e) { console.error('[controls]:', e); }
      try { syncUiState(); } catch (e) { console.error('[ui]:', e); }
    }

    /**
     * UI 状态机：派生显示状态
     *   idle    — 还没抽到题
     *   ready   — 已抽到题，等待开始
     *   running — 挑战中
     *   paused  — 已暂停
     *   done    — 挑战完成
     */
    function deriveUiState() {
      if (timerState === 'running') return 'running';
      if (timerState === 'paused')  return 'paused';
      if (timerState === 'done')    return 'done';
      if (currentTopicId)           return 'ready';
      return 'idle';
    }

    function syncUiState() {
      try {
        const s = deriveUiState();
        const displayState = slotRunning ? 'spinning' : s;
        if (statusStrip) statusStrip.dataset.state = displayState;

        // 状态条主文案 + icon（合并 statusIcon）
        const stateMap = {
          idle:     { icon: '💡', text: '提示：请先点击上方区域抽取题目' },
          spinning: { icon: '🎲', text: '正在抽取，别急…' },
          ready:    { icon: '✅', text: '已就绪，随时可以点击下方【开始吧】' },
          running:  { icon: '▶️', text: '正在挑战中' },
          paused:   { icon: '⏸',  text: '已暂停，随时继续' },
          done:     { icon: '🎉', text: '完成了一次挑战，很棒' }
        };
        const cur = stateMap[displayState] || stateMap.idle;
        if (statusIcon) statusIcon.textContent = cur.icon;
        if (statusText) statusText.textContent = cur.text;
        if (timerSub) timerSub.textContent = displayState === 'running' ? '剩余时间' : (displayState === 'done' ? '很棒' : '倒计时');

        // 计时器是否显示（idle/spinning 时隐藏大字号，避免视觉冗余）
        const showTimer = (displayState !== 'idle' && displayState !== 'spinning');
        if (timerDisplay) timerDisplay.style.display = showTimer ? 'flex' : 'none';
        if (progressBar)  progressBar.style.display  = showTimer ? 'block' : 'none';

        // 卡片高亮
        if (trainCard) trainCard.classList.toggle('is-running', displayState === 'running');

        // 热区标记：是否已抽到题（控制 CTA 角标显隐）
        if (slotWrap) slotWrap.dataset.hasTopic = (s === 'idle') ? '0' : '1';

        // idle 状态：隐藏内嵌分类标签；非 idle：实时显示当前 scope
        if (s === 'idle') {
          if (slotBadge) slotBadge.classList.remove('show');
        } else {
          try { renderSlotBadge(); } catch (e) { console.error('[ui] renderSlotBadge:', e); }
        }
      } catch (e) { try { console.error('[ui] syncUiState:', e); } catch (_) {} }
    }

    /* ─── Slot Machine · rAF 多阶段减速动画 ───
       设计目标：根据产品需求，总时长约 0.9s（紧凑、仪式感合适）。
         · Phase 1 快速滚动 (0 ~ 300ms)：60~80ms 跳字
         · Phase 2 减速     (300 ~ 700ms)：从 80 平滑到 200ms
         · Phase 3 停顿     (700 ~ 900ms)：单次 200ms 停顿
         · Phase 4 揭晓     (剩余 ~450ms)：最终题目写入 + scale 0.9→1.05→1 入场
       关键原则：
         · 单次抽题的最终结果在动画开始前用 pickTopic() 提前锁定为 finalTopic
         · 动画过程中显示的所有"候选话题"只是路过，与 finalTopic 无关
         · 收尾时把 finalTopic 写入当前可见层并加 land 入场动画
       性能：
         · 单一 rAF 主循环驱动，不嵌套 setTimeout
         · DOM 仅修改 textContent / classList.toggle（opacity + transform）
    */
    let slotRunning = false;
    let slotRafId = 0;
    let slotStartTime = 0;
    let slotCurrentLayer = 'A';   // 当前可见层
    let slotPool = [];            // 候选话题池
    let slotLastText = '';        // 上一次显示的文本（防止连续重复）
    let slotStepCount = 0;        // 已跳字次数
    let slotFinalTopic = null;    // 本次抽题开始前已锁定的最终结果

    // ─── 总时长配置（毫秒）───
    // 快速滚动 0.3s + 减速 0.4s + 停顿 0.2s ≈ 0.9s（不含 0.45s 揭晓入场）
    const SLOT_PHASE1_END   = 300;   // 高速阶段结束（快速滚动 0.3s）
    const SLOT_PHASE2_END   = 700;   // 减速阶段结束（减速 0.4s）
    const SLOT_PAUSE_END    = 900;   // 停顿阶段结束（停顿 0.2s）
    const SLOT_TOTAL_TIME   = 900;   // 总时长（不含揭晓动画）

    // 各阶段目标间隔
    const SLOT_P1_INTERVAL  = 60;    // 高速阶段 ~60ms 跳字
    const SLOT_P2_END       = 200;   // 减速结束时的间隔
    const SLOT_PAUSE_INTERVAL = 200; // 停顿阶段的间隔

    /** ease-out cubic：前期快、后期慢（用于 progress 0→1 的非线性映射） */
    function easeOutCubic(t) {
      t = Math.max(0, Math.min(1, t));
      return 1 - Math.pow(1 - t, 3);
    }

    /** ease-in-out：用于 Phase 2、3 平滑减速 */
    function easeInOutCubic(t) {
      t = Math.max(0, Math.min(1, t));
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    /**
     * 根据已用时间计算下一次跳字间隔（毫秒）
     *   Phase 1 [0,300)：高速 ~60ms 跳字
     *   Phase 2 [300,700)：60 → 200ms 平滑过渡
     *   Phase 3 [700,900)：停顿 ~200ms（只跳 1 次）
     */
    function computeNextInterval(elapsed) {
      if (elapsed < SLOT_PHASE1_END) {
        // 高速：基线 60ms，±10ms 抖动模拟"随机感"
        return SLOT_P1_INTERVAL + (Math.random() * 20 - 10);
      }
      if (elapsed < SLOT_PHASE2_END) {
        // 减速：60 → 200ms，ease-in-out 让两端平
        const t = (elapsed - SLOT_PHASE1_END) / (SLOT_PHASE2_END - SLOT_PHASE1_END);
        const eased = easeInOutCubic(t);
        return SLOT_P1_INTERVAL + (SLOT_P2_END - SLOT_P1_INTERVAL) * eased;
      }
      if (elapsed < SLOT_PAUSE_END) {
        // 停顿阶段：200ms 间隔
        return SLOT_PAUSE_INTERVAL;
      }
      return 0;
    }

    /** 是否处于"假停顿"阶段（用于控制音效是否播放） */
    function isInPausePhase(elapsed) {
      return elapsed >= SLOT_PHASE2_END && elapsed < SLOT_PAUSE_END;
    }

    /**
     * 在某一层写入话题文本（不带 .empty，不触发 land 动画）
     */
    function setSlotText(layer, text) {
      const el = layer.querySelector('.topic');
      if (!el) return;
      el.textContent = text;
      el.classList.remove('empty', 'land', 'blur', 'ghost');
    }

    /**
     * 双层交叉淡入：
     *   incoming 先 hidden → 写入文本 → reflow → 加 visible → outgoing 隐藏
     *   使用 CSS 的 opacity 0/1 过渡，transform 不参与避免抖动
     */
    function swapLayers(nextText) {
      const layerA = document.getElementById('slotA');
      const layerB = document.getElementById('slotB');
      if (!layerA || !layerB) return;

      const incoming = slotCurrentLayer === 'A' ? layerB : layerA;
      const outgoing = slotCurrentLayer === 'A' ? layerA : layerB;

      // 立即隐藏 incoming（不需要 0.08s 过渡，使用 class toggle 瞬间）
      incoming.classList.remove('visible');
      // 写入新文本
      setSlotText(incoming, nextText);

      // 强制 reflow 让 transition 生效
      // eslint-disable-next-line no-unused-expressions
      incoming.offsetWidth;

      incoming.classList.add('visible');
      outgoing.classList.remove('visible');

      slotCurrentLayer = slotCurrentLayer === 'A' ? 'B' : 'A';
    }

    /**
     * 从候选池选一个不等于 slotLastText 的随机话题
     * 池子 ≤ 1 时直接返回，避免无限循环
     */
    function pickRandomFromPool() {
      if (!slotPool.length) return '';
      if (slotPool.length === 1) {
        slotLastText = slotPool[0].text;
        return slotPool[0].text;
      }
      let pick = slotPool[Math.floor(Math.random() * slotPool.length)];
      let guard = 0;
      while (pick.text === slotLastText && guard++ < 8) {
        pick = slotPool[Math.floor(Math.random() * slotPool.length)];
      }
      slotLastText = pick.text;
      return pick.text;
    }

    /**
     * rAF 主循环：按 elapsed time 决定下一次跳字时机
     * 不嵌套 setTimeout，避免累积误差
     */
    function slotLoop(now) {
      try {
        if (!slotRunning) return;

        const elapsed = now - slotStartTime;

        // 1) 超过总时长 → 收尾
        if (elapsed >= SLOT_TOTAL_TIME) {
          finishSlot();
          return;
        }

        // 2) 是否到下一次跳字时机
        const sinceLastStep = elapsed - (slotLoop._last || 0);
        const nextInterval = computeNextInterval(elapsed);

        if (slotStepCount === 0 || sinceLastStep >= nextInterval) {
          slotLoop._last = elapsed;
          slotStepCount++;

          const text = pickRandomFromPool();
          swapLayers(text);

          if (!isInPausePhase(elapsed)) {
            const progress = elapsed / SLOT_TOTAL_TIME;
            const vol = progress < 0.35 ? 0.14 : 0.10;
            const pitchScale = 1 - progress * 0.20;
            try { playClick(vol, pitchScale); } catch (e) { console.error('[audio] playClick:', e); }
          }
        }

        // 3) 继续下一帧
        if (typeof requestAnimationFrame === 'function') {
          slotRafId = requestAnimationFrame(slotLoop);
        } else {
          setTimeout(function () { slotLoop(Date.now() - slotStartTime + (window.__appCaps && window.__appCaps.t0 || 0)); }, 16);
        }
      } catch (e) {
        try { console.error('[slot] loop:', e); } catch (_) {}
        // 异常后立即收尾，避免无限空转
        try { finishSlot(); } catch (_) {}
      }
    }

    /**
     * 收尾：把 slotFinalTopic 写入当前可见层 + 落地动画 + 开箱音 + 解锁按钮
     */
    function finishSlot() {
      try {
        slotRunning = false;
        slotRafId = 0;
        slotLoop._last = 0;

        const final = slotFinalTopic;
        slotFinalTopic = null;

        if (!final) {
          unlockDrawButton();
          if (slotWrap) slotWrap.classList.remove('spinning');
          return;
        }

        // 揭晓音：柔和 pop
        try { playRevealSound(); } catch (e) { console.error('[audio] reveal:', e); }

        // 把 finalTopic 写入当前可见层
        const finalLayerId = slotCurrentLayer === 'A' ? 'slotA' : 'slotB';
        const finalLayer = document.getElementById(finalLayerId);
        if (finalLayer) {
          setSlotText(finalLayer, final.text);
          finalLayer.classList.add('visible');
          const otherId = slotCurrentLayer === 'A' ? 'slotB' : 'slotA';
          const other = document.getElementById(otherId);
          if (other) other.classList.remove('visible');
        }

        // 揭晓入场：scale + opacity（用 land 类）
        const topicNode = finalLayer ? finalLayer.querySelector('.topic') : null;
        if (topicNode) {
          topicNode.classList.remove('land');
          // eslint-disable-next-line no-unused-expressions
          topicNode.offsetWidth;
          topicNode.classList.add('land');
        }

        // 题目区域短暂高光（≈450ms 一次性）
        if (slotWrap) {
          slotWrap.classList.remove('reveal');
          // eslint-disable-next-line no-unused-expressions
          slotWrap.offsetWidth;
          slotWrap.classList.add('reveal');
          setTimeout(function () { try { slotWrap.classList.remove('reveal'); } catch (_) {} }, 450);
        }

        // 退出 spinning 态
        if (slotWrap) slotWrap.classList.remove('spinning');

        // 揭晓后更新内嵌分类标签
        try { renderSlotBadge(); } catch (e) { console.error('[slot] renderSlotBadge:', e); }

        // 更新全局状态
        currentTopicId = final.id;
        lastTopicId = final.id;
        if (modal && modal.classList && modal.classList.contains('open')) { try { renderModalList(); } catch (_) {} }

        // 同步 UI
        try { syncUiState(); } catch (e) { console.error('[slot] syncUiState:', e); }

        // 揭晓入场动画结束后解锁按钮 + 移除 land
        setTimeout(function () {
          try { if (topicNode) topicNode.classList.remove('land'); } catch (_) {}
          try { unlockDrawButton(); } catch (_) {}
        }, 450);
      } catch (e) {
        try { console.error('[slot] finishSlot:', e); } catch (_) {}
        try { unlockDrawButton(); } catch (_) {}
      }
    }

    function lockDrawButton() {
      try {
        // 锁定核心热区：禁用 + 视觉提示
        if (slotWrap) {
          slotWrap.disabled = true;
          slotWrap.setAttribute('aria-disabled', 'true');
        }
        syncUiState();
      } catch (_) {}
    }

    function unlockDrawButton() {
      try {
        if (slotWrap) {
          slotWrap.disabled = false;
          slotWrap.removeAttribute('aria-disabled');
        }
        syncUiState();
      } catch (_) {}
    }

    /**
     * 主入口：点击抽题按钮 / 空格触发
     */
    function doSlotMachine() {
      try {
        if (slotRunning) return;        // 防重入

        // 按当前抽题范围构造候选池
        const pool = getScopedTopics();
        if (!pool.length) {
          if (trainingScope.type === 'group') {
            const g = groups.find(function (x) { return x.id === trainingScope.groupId; });
            showToast(`「${g ? g.name : '当前'}」分组还没有题目`);
          } else if (trainingScope.type === 'ungrouped') {
            showToast('未分组暂无挑战，请先添加');
          } else {
            showToast('挑战库为空，请先添加挑战');
          }
          return;
        }

        if (timerState === 'running') pauseTimer();
        resetTimer();

        // 关键：提前确定最终话题（在动画开始前锁定）
        const final = pickTopic();
        if (!final) {
          showToast('抽题失败');
          return;
        }
        slotFinalTopic = final;

        // 构造动画候选池
        slotPool = pool;
        slotLastText = final.text;
        slotStepCount = 0;
        slotLoop._last = 0;

        // 重置双层
        slotCurrentLayer = 'A';

        // UI 进入 spinning 态
        if (slotWrap) slotWrap.classList.add('spinning');
        lockDrawButton();

        // 预热音频
        try { warmUpAudio(); } catch (e) { console.error('[audio] warmUp:', e); }
        const ctx = getAudioCtx();
        if (ctx && ctx.state === 'suspended') {
          try { ctx.resume(); } catch (_) {}
        }

        // 启动 rAF 主循环
        slotRunning = true;
        slotStartTime = (window.performance && typeof performance.now === 'function') ? performance.now() : Date.now();
        if (typeof requestAnimationFrame === 'function') {
          slotRafId = requestAnimationFrame(slotLoop);
        } else {
          setTimeout(slotLoop, 16);
        }
      } catch (e) {
        console.error('[slot] doSlotMachine:', e);
        try { unlockDrawButton(); } catch (_) {}
        try { if (slotWrap) slotWrap.classList.remove('spinning'); } catch (_) {}
      }
    }

    function selectFromLibrary(id) {
      const item = topics.find(t => t.id === id);
      if (!item) return;
      showTopic(item);
      closeModal();
      resetTimer();
    }

    /* ─── Topic CRUD ─── */
    function updateSelectionUI() {
      try {
        const count = selectedIds.size;
        if (btnDelSel) {
          btnDelSel.disabled = count === 0;
          btnDelSel.textContent = count > 0 ? `删除选中 (${count})` : "删除选中";
        }
        if (btnMoveSel) {
          btnMoveSel.disabled = count === 0;
          btnMoveSel.textContent = count > 0 ? `移动到分组 (${count})` : "移动到分组";
        }
        if (Array.isArray(topics) && selectAllEl) {
          const allIds = topics.map(function (t) { return t && t.id; }).filter(Boolean);
          selectAllEl.checked = allIds.length > 0 && count === allIds.length;
          selectAllEl.indeterminate = count > 0 && count < allIds.length;
        }
      } catch (e) { try { console.error('[selection] updateSelectionUI:', e); } catch (_) {} }
    }

    function toggleSelect(id, checked) {
      checked ? selectedIds.add(id) : selectedIds.delete(id);
      updateSelectionUI();
      const row = modalBody.querySelector(`[data-id="${id}"]`);
      if (row) row.classList.toggle("selected", checked);
    }

    function addTopic(text, groupId) {
      const trimmed = String(text || '').trim();
      if (!trimmed) return false;
      // 校验 groupId：必须是真实存在的分组 id，否则置 null
      const gid = (groupId && groups.some(function (g) { return g.id === groupId; })) ? groupId : null;
      topics.push({ id: generateId(), text: trimmed, groupId: gid });
      saveTopics();
      return true;
    }

    function editTopic(id, newText) {
      const trimmed = newText.trim();
      if (!trimmed) return false;
      const item = topics.find(t => t.id === id);
      if (!item) return false;
      item.text = trimmed;
      saveTopics();
      if (currentTopicId === id) showTopic(item);
      return true;
    }

    function deleteTopics(ids) {
      const idSet = ids instanceof Set ? ids : new Set(ids);
      if (idSet.size === 0) return;
      topics = topics.filter(t => !idSet.has(t.id));
      saveTopics();
      idSet.forEach(id => selectedIds.delete(id));
      
      if (currentTopicId && idSet.has(currentTopicId)) {
        // 强制写入 A 层空状态
        const topicA = document.querySelector('#slotA .topic');
        if (topicA) {
          topicA.innerHTML = "点击下方按钮<br>开始你的表达力训练";
          topicA.classList.add("empty");
        }
        
        // 同时复位 slot 双层结构
        try {
          const slotA = document.getElementById('slotA');
          const slotB = document.getElementById('slotB');
          if (slotA) slotA.classList.add('visible');
          if (slotB) { 
            slotB.classList.remove('visible'); 
            const topicB = slotB.querySelector('.topic');
            if (topicB) topicB.textContent = '';
          }
          slotCurrentLayer = 'A';
        } catch (_) {}
        
        currentTopicId = null;
        resetTimer();
      }
      
      editingId = null;
      renderModalList();
      syncUiState();
      showToast(`已删除 ${idSet.size} 个挑战`);
    }

    /**
     * 解析文件内容。返回 [{ text, groupId }]
     * groupId 暂统一为 null（由调用方在"上传到分组"弹窗中决定覆盖）
     */
    function parseTxt(c) {
      return c.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean)
        .map(function (text) { return { text: text, groupId: null }; });
    }

    function parseCsv(c) {
      return c.split(/\r?\n/).filter(function (l) { return l.trim(); }).map(function (line) {
        const cols = line.match(/("([^"]|"")*"|[^,]*)/g) || [];
        const clean = cols.map(function (x) {
          return x.replace(/^"|"$/g, '').replace(/""/g, '"').trim();
        });
        const text = clean[0];
        return text ? { text: text, groupId: null } : null;
      }).filter(Boolean);
    }

    function parseJson(c) {
      const data = JSON.parse(c);
      if (!Array.isArray(data)) throw new Error('JSON 必须是数组');
      return data.map(function (item) {
        if (typeof item === 'string') return { text: item.trim(), groupId: null };
        if (item && typeof item.text === 'string') return { text: item.text.trim(), groupId: null };
        return null;
      }).filter(function (t) { return t && t.text; });
    }

    /**
     * 把解析后的话题加入 currentTopics。
     * 规则：若 text 与现有话题重复则跳过，否则加入。
     */
    function commitImportedTopics(items, groupId) {
      const gid = (groupId && groups.some(function (g) { return g.id === groupId; })) ? groupId : null;
      const existing = new Set(topics.map(function (t) { return t.text; }));
      let added = 0;
      items.forEach(function (it) {
        const text = String(it.text || '').trim();
        if (!text || existing.has(text)) return;
        topics.push({ id: generateId(), text: text, groupId: gid });
        existing.add(text);
        added++;
      });
      if (added > 0) saveTopics();
      return added;
    }

    function handleFileUpload(file) {
      const ext = file.name.split('.').pop().toLowerCase();
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const content = e.target.result;
          let parsed;
          if (ext === 'txt')        parsed = parseTxt(content);
          else if (ext === 'csv')   parsed = parseCsv(content);
          else if (ext === 'json')  parsed = parseJson(content);
          else { showToast('不支持的文件格式'); fileUpload.value = ''; return; }

          if (!parsed || !parsed.length) {
            showToast('没有可导入的挑战');
            fileUpload.value = '';
            return;
          }

          // 没有分组 → 直接导入未分组
          if (!groups.length) {
            const added = commitImportedTopics(parsed, null);
            fileUpload.value = '';
            if (added > 0) { renderModalList(); showToast(`成功导入 ${added} 个挑战`); }
            else showToast('没有可导入的挑战（重复或为空）');
            return;
          }

          // 有分组 → 弹窗让用户选择
          pendingUploadItems = parsed;
          pendingUploadExt = ext;
          openUploadGroupModal();
        } catch (err) {
          showToast('文件解析失败：' + err.message);
        }
        fileUpload.value = '';
      };
      reader.readAsText(file, 'UTF-8');
    }

    function startEdit(id) {
      editingId = id;
      renderModalList();
      const inp = modalBody.querySelector(`[data-edit-id="${id}"]`);
      if (inp) { inp.focus(); inp.select(); }
    }

    function cancelEdit() { editingId = null; renderModalList(); }

    function saveEdit(id, text) {
      if (!editTopic(id, text)) { showToast("挑战内容不能为空"); return; }
      editingId = null;
      renderModalList();
      showToast("挑战已更新");
    }

    function createTopicRow(item) {
      const row = document.createElement("li");
      row.className = "topic-row";
      row.dataset.id = item.id;
      if (item.id === currentTopicId) row.classList.add("active");
      if (selectedIds.has(item.id)) row.classList.add("selected");

      const check = document.createElement("input");
      check.type = "checkbox";
      check.className = "topic-check";
      check.checked = selectedIds.has(item.id);
      safeOn(check, "change", function () { toggleSelect(item.id, check.checked); });
      safeOn(check, "click", function (e) { e.stopPropagation(); });

      if (editingId === item.id) {
        const inp = document.createElement("input");
        inp.className = "topic-edit-input";
        inp.dataset.editId = item.id;
        inp.value = item.text;
        safeOn(inp, "click", function (e) { e.stopPropagation(); });
        safeOn(inp, "keydown", function (e) {
          if (e.key === "Enter") saveEdit(item.id, inp.value);
          if (e.key === "Escape") cancelEdit();
        });
        const bS = document.createElement("button"); bS.className = "btn-icon save"; bS.textContent = "✓"; bS.title = "保存"; safeOn(bS, "click", function (e) { e.stopPropagation(); saveEdit(item.id, inp.value); });
        const bC = document.createElement("button"); bC.className = "btn-icon cancel"; bC.textContent = "✗"; bC.title = "取消"; safeOn(bC, "click", function (e) { e.stopPropagation(); cancelEdit(); });
        row.append(check, inp, bS, bC);
      } else {
        const span = document.createElement("span");
        span.className = "topic-text";
        span.textContent = item.text;
        span.title = "点击设为当前挑战";
        safeOn(span, "click", function () { selectFromLibrary(item.id); });
        const bE = document.createElement("button"); bE.className = "btn-icon"; bE.textContent = "✎"; bE.title = "编辑"; safeOn(bE, "click", function (e) { e.stopPropagation(); startEdit(item.id); });
        const bD = document.createElement("button"); bD.className = "btn-icon cancel"; bD.textContent = "×"; bD.title = "删除"; safeOn(bD, "click", function (e) { e.stopPropagation(); deleteTopics(new Set([item.id])); });
        row.append(check, span, bE, bD);
      }
      return row;
    }

    /**
     * 渲染话题库列表：
     * 1) "未分组" 永远在最前面
     * 2) 用户自定义分组按保存顺序排在后面
     * 3) 即使分组为空也保留该分组标题
     */
    function renderModalList() {
      try {
        if (!modalBody) return;
        modalBody.innerHTML = '';
        if (modalCount) modalCount.textContent = `共 ${topics.length} 个挑战`;

        // "未分组" 区
        const ungrouped = (topics || []).filter(function (t) { return t && t.groupId == null; });
        const sec1 = buildGroupSection({
          key: 'ungrouped',
          title: '未分组',
          cls: 'ungrouped',
          section: { kind: 'ungrouped' },
          items: ungrouped,
          actions: []
        });
        if (sec1) modalBody.appendChild(sec1);

        // 用户自定义分组
        (groups || []).forEach(function (g) {
          const items = (topics || []).filter(function (t) { return t && t.groupId === g.id; });
          const sec = buildGroupSection({
            key: 'group-' + g.id,
            title: g.name,
            cls: 'group',
            dataId: g.id,
            section: { kind: 'group', groupId: g.id },
            items: items,
            actions: [
              { title: '重命名', text: '✎', cls: 'edit',  onClick: function () { openGroupRenameModal(g.id); } },
              { title: '删除',   text: '×', cls: 'cancel', onClick: function () { confirmDeleteGroup(g.id); } }
            ]
          });
          if (sec) modalBody.appendChild(sec);
        });

        if (!topics.length) {
          modalBody.innerHTML = '<p style="color:var(--text-tertiary);font-size:0.9rem;text-align:center;padding:24px 0">暂无挑战，请添加或上传</p>';
        }

        // 同步"新增话题"分组选择器 & "移动到分组"按钮
        try { syncNewTopicGroupSelect(); } catch (e) { console.error('[modal] syncNewTopicGroupSelect:', e); }
        try { updateSelectionUI(); } catch (e) { console.error('[modal] updateSelectionUI:', e); }
      } catch (e) {
        try { console.error('[modal] renderModalList:', e); } catch (_) {}
      }
    }

    function buildGroupSection(opts) {
      const gEl = document.createElement('div');
      gEl.className = 'modal-group';
      gEl.dataset.groupKey = opts.key;

      const section = opts.section || { kind: opts.cls === 'group' ? 'group' : 'ungrouped', groupId: opts.dataId };
      if (isCollapsed(section)) gEl.classList.add('collapsed');

      const titleEl = document.createElement('div');
      titleEl.className = 'modal-group-title ' + opts.cls;

      const caret = document.createElement('span');
      caret.className = 'group-caret';
      caret.textContent = '⌄';

      const label = document.createElement('span');
      label.textContent = `${opts.title}（${opts.items.length}）`;

      titleEl.append(caret, label);

      if (opts.actions && opts.actions.length) {
        const acts = document.createElement('span');
        acts.className = 'group-actions';
        opts.actions.forEach(function (a) {
          const b = document.createElement('button');
          b.className = 'btn-icon ' + (a.cls || '');
          b.textContent = a.text;
          b.title = a.title;
          b.addEventListener('click', function (e) {
            e.stopPropagation();
            try { a.onClick(); } catch (err) { try { console.warn(err); } catch (_) {} }
          });
          acts.appendChild(b);
        });
        titleEl.appendChild(acts);
      }

      // 点击标题切换折叠（不包括操作按钮，已 stopPropagation）
      titleEl.addEventListener('click', function () {
        const collapsed = gEl.classList.toggle('collapsed');
        setCollapsed(section, collapsed);
      });

      // 折叠体
      const body = document.createElement('div');
      body.className = 'group-body';

      const ul = document.createElement('ul');
      ul.className = 'topic-list';
      if (opts.items.length) {
        opts.items.forEach(function (item) { ul.appendChild(createTopicRow(item)); });
      } else {
        const li = document.createElement('li');
        li.className = 'group-empty-hint';
        li.textContent = '暂无挑战';
        ul.appendChild(li);
      }
      body.appendChild(ul);

      gEl.append(titleEl, body);
      return gEl;
    }

    /**
     * 同步"新增话题"分组下拉：
     * - 没有分组 → 隐藏下拉
     * - 有分组   → 显示，选项 = 未分组 + 所有分组
     */
    function syncNewTopicGroupSelect() {
      const sel = newTopicGroup;
      if (!sel) return;
      if (!groups.length) {
        sel.style.display = 'none';
        sel.innerHTML = '';
        return;
      }
      sel.style.display = '';
      const prev = sel.value;
      sel.innerHTML = '';
      const o0 = document.createElement('option');
      o0.value = ''; o0.textContent = '未分组';
      sel.appendChild(o0);
      groups.forEach(function (g) {
        const o = document.createElement('option');
        o.value = g.id;
        o.textContent = g.name;
        sel.appendChild(o);
      });
      sel.value = (prev && groups.some(function (g) { return g.id === prev; })) ? prev : '';
    }

    function confirmDeleteGroup(id) {
      const g = groups.find(function (x) { return x.id === id; });
      if (!g) return;
      const movedCount = topics.filter(function (t) { return t.groupId === id; }).length;
      const msg = `确定删除"${g.name}"分组吗？\n\n该分组中的 ${movedCount} 个挑战不会被删除，它们将自动移动到"未分组"。`;
      if (!confirm(msg)) return;
      const res = deleteGroup(id);
      if (!res.ok) { showToast(res.msg || '删除失败'); return; }
      renderModalList();
      // setTrainingScope 在 deleteGroup 内已调用，这里再同步渲染一次
      renderScopePill();
      showToast(`已删除分组"${g.name}"，${res.movedCount} 个挑战已转入未分组`);
    }

    function openModal()  {
      try { editingId = null; renderModalList(); } catch (e) { console.error('[modal] open:', e); }
      try { if (modal) modal.classList.add("open"); } catch (_) {}
    }
    function closeModal(){
      try { if (modal) modal.classList.remove("open"); editingId = null; } catch (_) {}
    }

    /* ─── Init · 包在 try/catch 中，确保任意一步失败不阻塞后续 ─── */
    function bootApp() {
      try {
        // 1) 旧数据迁移（cat → groupId: null）
        try { migrateOldTopics(); } catch (e) { console.error('[boot] migrateOldTopics:', e); }
        // 2) 加载课程库话题 + 分组
        try { topics = loadTopics(); } catch (e) { console.error('[boot] loadTopics:', e); topics = []; }
        try { groups = loadGroups(); } catch (e) { console.error('[boot] loadGroups:', e); groups = []; }
        // 兜底：即使异常也要保证是数组
        if (!Array.isArray(topics)) topics = [];
        if (!Array.isArray(groups)) groups = [];
        // 3) 兜底：确保每个话题都带 groupId 字段（防止老数据 / 第三方脏数据）
        topics.forEach(function (t) {
          if (!t || typeof t.text !== 'string') return;
          if (!('groupId' in t)) t.groupId = null;
        });
        // 4) 加载抽题范围 + 折叠状态
        try { trainingScope = loadTrainingScope(); } catch (e) { console.error('[boot] loadTrainingScope:', e); trainingScope = { type: 'all' }; }
        try { groupCollapseMap = loadCollapseMap(); } catch (e) { console.error('[boot] loadCollapseMap:', e); groupCollapseMap = {}; }
        // 5) 兜底：scope 引用的分组不存在时回退到全部
        try { validateScope(); } catch (e) { console.error('[boot] validateScope:', e); }
        // 6) 渲染顶部"抽题范围"显示
        try { renderScopePill(); } catch (e) { console.error('[boot] renderScopePill:', e); }
        // 7) 计时器
        let durSec = 180;
        try { durSec = loadDuration(); } catch (e) { console.error('[boot] loadDuration:', e); durSec = 180; }
        if (!(durSec > 0)) durSec = 180;
        const _dH = Math.floor(durSec / 3600);
        const _dM = Math.floor((durSec % 3600) / 60);
        const _dS = durSec % 60;
        if (timeInputH) timeInputH.value = String(_dH).padStart(2, '0');
        if (timeInputM) timeInputM.value = String(_dM).padStart(2, '0');
        if (timeInputS) timeInputS.value = String(_dS).padStart(2, '0');
        totalSeconds = durSec;
        remaining = totalSeconds;
        if (timerEl) timerEl.textContent = formatTime(totalSeconds);
        try { updateControls(); } catch (e) { console.error('[boot] updateControls:', e); }
        // 8) 初始化内嵌分类标签为隐藏
        if (slotBadge) { slotBadge.textContent = ''; slotBadge.classList.remove('show'); }
        // 8.5) 初始化训练次数（从 localStorage 读，跨日自动重置）
        try { renderTrainCount(loadDailyCount(), false); } catch (e) { console.error('[boot] renderTrainCount:', e); }
        // 9) 时间快捷按钮
        try { bindDurationPresets(); } catch (e) { console.error('[boot] bindDurationPresets:', e); }
        try { syncDurationPresets(); } catch (e) { console.error('[boot] syncDurationPresets:', e); }
        // 10) 同步 UI 状态机 + 分类标签
        try { syncUiState(); } catch (e) { console.error('[boot] syncUiState:', e); }
        try { renderSlotBadge(); } catch (e) { console.error('[boot] renderSlotBadge:', e); }
      } catch (err) {
        console.error('[boot] fatal init error:', err);
      }
    }

    // 等待 DOM 就绪再 boot
    if (typeof window.__whenReady === 'function') {
      window.__whenReady(bootApp);
    } else {
      try { bootApp(); } catch (_) {}
    }

    /* 训练时长快捷按钮 + 自定义时分秒 */
    function getCurrentCustomSeconds() {
      // 读取 HH/MM/SS 输入框原始字符（不规范化），未填视为 0
      const h = parseInt(timeInputH.value, 10);
      const m = parseInt(timeInputM.value, 10);
      const s = parseInt(timeInputS.value, 10);
      const H = isNaN(h) || h < 0 ? 0 : (h > 99 ? 99 : h);
      const M = isNaN(m) || m < 0 ? 0 : (m > 59 ? 59 : m);
      const S = isNaN(s) || s < 0 ? 0 : (s > 59 ? 59 : s);
      return H * 3600 + M * 60 + S;
    }

    /** 把当前选择的总秒数写入 LocalStorage，并刷新页面 timer */
    function applyDurationSeconds(sec) {
      try {
        if (!(sec > 0)) sec = 1; // 防御
        totalSeconds = sec;
        try { saveDuration(sec); } catch (e) { console.error('[storage] save duration:', e); }
        if (timerState === 'idle' || timerState === 'done') {
          remaining = totalSeconds;
          if (timerEl) timerEl.textContent = formatTime(totalSeconds);
          if (progressEl) {
            progressEl.style.width = '0%';
            progressEl.className = 'progress-fill';
          }
        }
      } catch (e) { try { console.error('[duration] applyDurationSeconds:', e); } catch (_) {} }
    }

    /** 把总秒数拆分并回填到三个输入框（不立即应用为选中时间） */
    function fillCustomInputsFromSeconds(sec) {
      try {
        if (sec == null || isNaN(sec) || sec <= 0) sec = 300;
        const H = Math.floor(sec / 3600);
        const M = Math.floor((sec % 3600) / 60);
        const S = sec % 60;
        if (timeInputH) timeInputH.value = String(H).padStart(2, '0');
        if (timeInputM) timeInputM.value = String(M).padStart(2, '0');
        if (timeInputS) timeInputS.value = String(S).padStart(2, '0');
      } catch (e) { try { console.error('[duration] fillCustomInputsFromSeconds:', e); } catch (_) {} }
    }

    /** 限制输入为数字字符并自动加 0 前缀以保证两位 */
    function clampTimeInput(input, max, digits) {
      if (!input) return;
      // 去掉所有非数字字符
      let raw = input.value.replace(/\D+/g, '');
      if (raw === '') raw = '';
      // 立即规范化：长度限制
      if (raw.length > digits) raw = raw.slice(0, digits);
      // 边界：> max 时截断到 max
      let n = raw === '' ? 0 : parseInt(raw, 10);
      if (isNaN(n)) n = 0;
      if (max != null && n > max) {
        n = max;
        raw = String(n);
      }
      input.value = digits === 2 ? String(n).padStart(2, '0') : String(n);
    }

    function showCustomDuration(show) {
      if (show) customDurationWrap.classList.add('show');
      else customDurationWrap.classList.remove('show');
    }

    function bindDurationPresets() {
      if (!durationPresets || typeof durationPresets.querySelectorAll !== 'function') return;
      const chips = durationPresets.querySelectorAll('.duration-chip');
      chips.forEach(function (chip) {
        safeOn(chip, 'click', function () {
          // 训练中禁止改时间
          if (timerState === 'running' || timerState === 'paused') {
            showToast('请暂停训练后修改时间');
            return;
          }
          const v = chip.dataset.min;
          if (v === 'custom') {
            // 先把当前已选时间回填到输入框，避免每次都从 0 开始
            fillCustomInputsFromSeconds(totalSeconds);
            showCustomDuration(true);
            setCustomError('');
            // 焦点放到小时
            setTimeout(() => { timeInputH.focus(); timeInputH.select(); }, 40);
            syncDurationPresets();
            return;
          }
          const n = parseInt(v, 10);
          if (isNaN(n)) return;
          // 切换到快捷时间：收起自定义面板，并把对应秒数写进去
          showCustomDuration(false);
          setCustomError('');
          const sec = n * 60;
          applyDurationSeconds(sec);
          // 把当前选择同步到输入框（即使面板隐藏也无妨）
          fillCustomInputsFromSeconds(sec);
          syncDurationPresets();
        });
      });
    }

    function syncDurationPresets() {
      if (!durationPresets || typeof durationPresets.querySelectorAll !== 'function') return;
      const chips = durationPresets.querySelectorAll('.duration-chip');
      let matched = false;
      chips.forEach(function (chip) {
        const v = chip.dataset.min;
        if (v !== 'custom') {
          const n = parseInt(v, 10);
          if (n * 60 === totalSeconds) {
            chip.classList.add('active');
            matched = true;
          } else {
            chip.classList.remove('active');
          }
        }
      });
      // 自定义激活条件：当前总秒数不等于任意快捷 chip
      durationCustomChip.classList.toggle('active', !matched);
    }

    /* 输入体验：每输入都规范化 */
    [timeInputH, timeInputM, timeInputS].forEach(function (inp, idx) {
      if (!inp) return;
      const max = inp === timeInputH ? 99 : 59;
      safeOn(inp, 'input', function () { clampTimeInput(inp, max, 2); setCustomError(''); });
      safeOn(inp, 'blur',  function () { clampTimeInput(inp, max, 2); });
      safeOn(inp, 'focus', function () {
        // 输入框全部选中，方便覆盖输入
        setTimeout(function () { try { inp.select(); } catch (_) {} }, 0);
      });
      safeOn(inp, 'keydown', function (e) {
        if (e.key === 'Enter') { try { inp.blur(); } catch (_) {} if (btnConfirmTime) btnConfirmTime.click(); }
      });
    });

    /* 训练过程中锁定自定义面板的输入与确认按钮 */
    function syncCustomDurationLock() {
      try {
        const locked = (timerState === 'running' || timerState === 'paused');
        [timeInputH, timeInputM, timeInputS].forEach(function (i) { if (i) i.disabled = locked; });
        if (btnConfirmTime) {
          btnConfirmTime.disabled = locked;
          btnConfirmTime.classList.toggle('locked', locked);
        }
        // 快捷按钮也要禁用
        if (durationPresets && typeof durationPresets.querySelectorAll === 'function') {
          durationPresets.querySelectorAll('.duration-chip').forEach(function (c) { if (c) c.disabled = locked; });
        }
      } catch (e) { try { console.error('[controls] syncCustomDurationLock:', e); } catch (_) {} }
    }

    function setCustomError(msg) {
      customDurationError.textContent = msg || '';
      customDurationError.style.opacity = msg ? '1' : '0';
    }

    /* 确认时间按钮：把 HH/MM/SS 合成总秒数并应用 */
    safeOn(btnConfirmTime, 'click', function () {
      if (timerState === 'running' || timerState === 'paused') {
        showToast('请暂停训练后修改时间');
        return;
      }
      // 最后一次规范化
      clampTimeInput(timeInputH, 99, 2);
      clampTimeInput(timeInputM, 59, 2);
      clampTimeInput(timeInputS, 59, 2);
      const sec = getCurrentCustomSeconds();
      if (!(sec > 0)) {
        setCustomError('训练时间不能为 0');
        // 微抖动
        customDurationWrap.animate(
          [{ transform: 'translateX(0)' }, { transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'translateX(0)' }],
          { duration: 220, easing: 'ease-out' }
        );
        return;
      }
      setCustomError('');
      applyDurationSeconds(sec);
      // 收起面板 + "自定义"按钮进入选中态
      showCustomDuration(false);
      syncDurationPresets();
      // 按钮微反馈
      btnConfirmTime.animate(
        [{ transform: 'scale(1)' }, { transform: 'scale(0.96)' }, { transform: 'scale(1)' }],
        { duration: 180, easing: 'ease-out' }
      );
    });

    /* 核心交互热区：点击触发抽题 */
    if (slotWrap) {
      slotWrap.addEventListener("click", e => {
        // 避免冒泡触发两次
        e.preventDefault();
        doSlotMachine();
      });
    }

    /* 空格触发抽题（输入框/textarea 内不响应）—— 整体 try/catch 包裹，确保键盘事件独立安全 */
    document.addEventListener("keydown", function (e) {
      try {
        if (e.code !== "Space") return;
        const ae = document.activeElement;
        if (!ae) { /* noop */ }
        else if (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA" || ae.contentEditable === "true") return;
        if (typeof e.preventDefault === 'function') e.preventDefault();
        // 触发轻微按下反馈（在热区上）
        if (slotWrap) {
          slotWrap.style.transform = "scale(0.992)";
          setTimeout(function () { slotWrap.style.transform = ""; }, 110);
        }
        if (typeof doSlotMachine === 'function') doSlotMachine();
      } catch (err) {
        try { console.error('[space-key] handler:', err); } catch (_) {}
      }
    });

    safeOn(btnPlay, "click", () => {
      if (timerState === "done") {
        // 再来一次：保留题目，仅重置时间
        resetTimer();
        return;
      }
      if (timerState === "running") {
        pauseTimer();
        return;
      }
      if (timerState === "paused") {
        // 继续
        startTimer();
        return;
      }
      // idle
      if (!currentTopicId) { showToast("请先抽取一个挑战"); return; }
      // 训练时间为 0 不允许开始
      if (!(totalSeconds > 0)) {
        showToast("训练时间不能为 0");
        return;
      }
      startTimer();
    });

    safeOn(btnReset, "click", () => {
      if (timerState !== "idle" && timerState !== "done") resetTimer();
    });

    safeOn(selectAllEl, "change", () => {
      if (selectAllEl.checked) topics.forEach(t => selectedIds.add(t.id));
      else selectedIds.clear();
      renderModalList();
    });

    safeOn(btnDelSel, "click", () => {
      if (!selectedIds.size) return;
      if (!confirm(`确定删除选中的 ${selectedIds.size} 个挑战吗？`)) return;
      deleteTopics(new Set(selectedIds));
      selectedIds.clear();
    });

    safeOn(btnAddTopic, "click", () => {
      const gid = newTopicGroup && newTopicGroup.style.display !== 'none' ? newTopicGroup.value : null;
      if (!addTopic(newTopicIn.value, gid)) { showToast("请输入挑战内容"); return; }
      saveTopics();
      newTopicIn.value = "";
      renderModalList();
      showToast("挑战已添加");
    });

    safeOn(newTopicIn, "keydown", e => { if (e.key === "Enter") btnAddTopic && btnAddTopic.click(); });
    safeOn(fileUpload, "change", e => { const f = e.target.files[0]; if (f) handleFileUpload(f); });
    safeOn(btnLibrary, "click", () => { closeScopeMenu(); openModal(); });
    safeOn(modalClose, "click", closeModal);
    safeOn(modal, "click", e => { if (e.target === modal) closeModal(); });

    /* 抽题范围选择器交互 */
    safeOn(scopePill, 'click', function (e) {
      e.stopPropagation();
      toggleScopeMenu();
    });
    // 点击页面其他位置关闭 scope menu
    document.addEventListener('click', function (e) {
      if (!scopeMenu.classList.contains('open')) return;
      if (e.target === scopePill || scopePill.contains(e.target)) return;
      if (scopeMenu.contains(e.target)) return;
      closeScopeMenu();
    });
    // 滚动 / resize 时也收起
    safeOn(window, 'resize', closeScopeMenu);
    safeOn(window, 'scroll', closeScopeMenu, true);
    safeOn(scopeMenu, 'click', function (e) { e.stopPropagation(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") {
      // 关闭最上层的弹窗
      if (moveGroupModal && moveGroupModal.classList.contains('open')) closeMoveGroupModal();
      else if (uploadGroupModal && uploadGroupModal.classList.contains('open')) closeUploadGroupModal();
      else if (groupModal && groupModal.classList.contains('open')) closeGroupModal();
      else closeModal();
    } });

    /* ─── Group modal · 新建 / 重命名 ─── */
    function openGroupCreateModal() {
      try {
        groupModalMode = 'create';
        groupModalTargetId = null;
        if (groupModalTitle) groupModalTitle.textContent = '新建分组';
        if (groupModalConfirm) groupModalConfirm.textContent = '创建';
        if (groupNameInput) groupNameInput.value = '';
        if (groupModal) groupModal.classList.add('open');
        setTimeout(function () { try { if (groupNameInput) groupNameInput.focus(); } catch (_) {} }, 50);
      } catch (e) { try { console.error('[group] openCreate:', e); } catch (_) {} }
    }

    function openGroupRenameModal(id) {
      try {
        const g = groups.find(function (x) { return x.id === id; });
        if (!g) return;
        groupModalMode = 'rename';
        groupModalTargetId = id;
        if (groupModalTitle) groupModalTitle.textContent = '重命名分组';
        if (groupModalConfirm) groupModalConfirm.textContent = '保存';
        if (groupNameInput) groupNameInput.value = g.name;
        if (groupModal) groupModal.classList.add('open');
        setTimeout(function () { try { if (groupNameInput) { groupNameInput.focus(); groupNameInput.select(); } } catch (_) {} }, 50);
      } catch (e) { try { console.error('[group] openRename:', e); } catch (_) {} }
    }

    function closeGroupModal() {
      try {
        if (groupModal) groupModal.classList.remove('open');
        if (groupNameInput) groupNameInput.value = '';
        groupModalTargetId = null;
      } catch (_) {}
    }

    function submitGroupModal() {
      try {
        const name = groupNameInput ? groupNameInput.value : '';
        if (groupModalMode === 'create') {
          const res = createGroup(name);
          if (!res.ok) { showToast(res.msg || '创建失败'); return; }
          closeGroupModal();
          try { renderModalList(); } catch (_) {}
          try { renderScopePill(); } catch (_) {}
          showToast(`已创建分组"${res.group.name}"`);
        } else {
          const res = renameGroup(groupModalTargetId, name);
          if (!res.ok) { showToast(res.msg || '重命名失败'); return; }
          closeGroupModal();
          try { renderModalList(); } catch (_) {}
          try { renderScopePill(); } catch (_) {}
          showToast('分组已重命名');
        }
      } catch (e) { try { console.error('[group] submit:', e); } catch (_) {} }
    }

    safeOn(btnNewGroup, 'click', openGroupCreateModal);
    safeOn(groupModalClose, 'click', closeGroupModal);
    safeOn(groupModalCancel, 'click', closeGroupModal);
    safeOn(groupModalConfirm, 'click', submitGroupModal);
    safeOn(groupModal, 'click', function (e) { if (e.target === groupModal) closeGroupModal(); });
    safeOn(groupNameInput, 'keydown', function (e) {
      if (e.key === 'Enter') submitGroupModal();
      if (e.key === 'Escape') closeGroupModal();
    });

    /* ─── Upload group modal · 上传前选择分组 ─── */
    function openUploadGroupModal() {
      // 填充选项：未分组 + 所有分组
      if (!uploadGroupSelect || !uploadGroupModal) return;
      uploadGroupSelect.innerHTML = '';
      const o0 = document.createElement('option');
      o0.value = ''; o0.textContent = '未分组';
      uploadGroupSelect.appendChild(o0);
      groups.forEach(function (g) {
        const o = document.createElement('option');
        o.value = g.id; o.textContent = g.name;
        uploadGroupSelect.appendChild(o);
      });
      uploadGroupSelect.value = '';
      uploadGroupModal.classList.add('open');
    }

    function closeUploadGroupModal() {
      if (uploadGroupModal) uploadGroupModal.classList.remove('open');
      pendingUploadItems = null;
      pendingUploadExt = null;
    }

    function confirmUploadGroup() {
      if (!pendingUploadItems) { closeUploadGroupModal(); return; }
      const gid = (uploadGroupSelect && uploadGroupSelect.value) || null;
      const added = commitImportedTopics(pendingUploadItems, gid);
      closeUploadGroupModal();
      if (added > 0) { renderModalList(); showToast(`成功导入 ${added} 个挑战`); }
      else showToast('没有可导入的挑战（重复或为空）');
    }

    safeOn(uploadGroupModalClose, 'click', closeUploadGroupModal);
    safeOn(uploadGroupCancel, 'click', closeUploadGroupModal);
    safeOn(uploadGroupConfirm, 'click', confirmUploadGroup);
    safeOn(uploadGroupModal, 'click', function (e) { if (e.target === uploadGroupModal) closeUploadGroupModal(); });

    /* ─── Move topics modal · 批量移动 ─── */
    function openMoveGroupModal() {
      if (!selectedIds.size) { showToast('请先选择挑战'); return; }
      if (!groups.length) { showToast('当前没有可用的分组，请先创建一个分组'); return; }
      pendingMoveIds = new Set(selectedIds);
      if (!moveGroupSelect || !moveGroupModal) return;
      moveGroupSelect.innerHTML = '';
      const o0 = document.createElement('option');
      o0.value = ''; o0.textContent = '未分组';
      moveGroupSelect.appendChild(o0);
      groups.forEach(function (g) {
        const o = document.createElement('option');
        o.value = g.id; o.textContent = g.name;
        moveGroupSelect.appendChild(o);
      });
      moveGroupSelect.value = '';
      moveGroupModal.classList.add('open');
    }

    function closeMoveGroupModal() {
      if (moveGroupModal) moveGroupModal.classList.remove('open');
      pendingMoveIds = null;
    }

    function confirmMoveGroup() {
      if (!pendingMoveIds || !pendingMoveIds.size) { closeMoveGroupModal(); return; }
      const gid = (moveGroupSelect && moveGroupSelect.value) || null;
      const res = moveTopicsToGroup(pendingMoveIds, gid);
      closeMoveGroupModal();
      selectedIds.clear();
      renderModalList();
      if (res.ok) showToast(`已移动 ${res.count} 个挑战`);
    }

    safeOn(btnMoveSel, 'click', openMoveGroupModal);
    safeOn(moveGroupModalClose, 'click', closeMoveGroupModal);
    safeOn(moveGroupCancel, 'click', closeMoveGroupModal);
    safeOn(moveGroupConfirm, 'click', confirmMoveGroup);
    safeOn(moveGroupModal, 'click', function (e) { if (e.target === moveGroupModal) closeMoveGroupModal(); });

    /* ─── Mobile-safety boot trace ───
       调试用：仅 console，不向 UI 显示任何错误信息
    */
    try { console.log('[boot] App initialized'); } catch (_) {}
    try { console.log('[boot] Topics loaded:', Array.isArray(topics) ? topics.length : 0); } catch (_) {}
    try { console.log('[boot] Groups loaded:', Array.isArray(groups) ? groups.length : 0); } catch (_) {}
    try { console.log('[boot] Audio:', !!(window.__appCaps && window.__appCaps.audio), 'Storage:', !!(window.__appCaps && window.__appCaps.storage)); } catch (_) {}
  </script>
</body>
</html>
