<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>表达力训练</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f5f5f7;
      --bg-elev: #ffffff;
      --bg-soft: rgba(0,0,0,0.025);
      --bg-softer: rgba(0,0,0,0.015);
      --card-bg: #ffffff;
      --text-primary: #1d1d1f;
      --text-secondary: #6e6e73;
      --text-tertiary: #a1a1a6;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --accent-soft: rgba(0,113,227,0.06);
      --accent-softer: rgba(0,113,227,0.04);
      --border: rgba(0, 0, 0, 0.06);
      --border-soft: rgba(0,0,0,0.045);
      --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.04);
      --shadow-md: 0 2px 8px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);
      --shadow-lg: 0 4px 16px rgba(0,0,0,0.04), 0 16px 40px rgba(0,0,0,0.08), 0 48px 80px rgba(0,0,0,0.04);
      --radius-card: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --radius-pill: 999px;
      --transition: 180ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --transition-fast: 120ms ease;
    }

    html { font-size: 16px; }

    body {
      min-height: 100vh;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0, 113, 227, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 90% 110%, rgba(88, 86, 214, 0.04) 0%, transparent 50%);
      color: var(--text-primary);
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding: 0 20px 56px;
    }

    /* ─── Header ─── */
    .header {
      width: 100%;
      max-width: 680px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0 6px;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, var(--accent) 0%, #5856d6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      flex-shrink: 0;
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      user-select: none;
    }

    .brand-wordmark {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .brand-title em {
      font-style: normal;
      background: linear-gradient(135deg, var(--accent), #5856d6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-tagline {
      font-size: 0.78rem;
      color: var(--text-tertiary);
      letter-spacing: 0.01em;
      line-height: 1.4;
      margin: 0;
    }

    .btn-library {
      background: rgba(0, 113, 227, 0.07);
      color: var(--accent);
      border: 1px solid rgba(0, 113, 227, 0.15);
      border-radius: var(--radius-pill);
      padding: 7px 16px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      letter-spacing: -0.01em;
    }

    .btn-library:hover {
      background: rgba(0, 113, 227, 0.12);
      border-color: rgba(0, 113, 227, 0.3);
      transform: translateY(-1px);
    }

    .btn-library:active { transform: translateY(0) scale(0.98); }

    /* ─── Main Card ─── */
    .card {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-lg);
      border: 0.5px solid rgba(0,0,0,0.04);
      padding: 8px 0 6px;
      text-align: center;
      position: relative;
      transition: box-shadow var(--transition), border-color var(--transition);
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
      pointer-events: none;
    }

    /* 卡片在训练状态时提升视觉权重 */
    .card.is-running {
      box-shadow: 0 4px 16px rgba(0,0,0,0.04), 0 16px 40px rgba(0, 113, 227, 0.10), 0 48px 80px rgba(0,0,0,0.06);
      border-color: rgba(0, 113, 227, 0.16);
    }

    .card-section {
      padding: 24px 32px 22px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 14px;
    }

    .card-section.scope-section { padding-bottom: 18px; }
    .card-section.challenge-section { padding: 26px 32px 22px; gap: 10px; }
    .card-section.duration-section { padding: 22px 32px 26px; gap: 16px; }

    .card-divider {
      height: 1px;
      background: var(--border);
      margin: 0 28px;
    }

    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--text-tertiary);
      text-transform: uppercase;
      text-align: left;
    }

    /* ─── Scope Selector（抽题范围） ─── */
    .scope-selector-wrap {
      position: relative;
    }

    .scope-selector {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-softer);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      cursor: pointer;
      transition: all var(--transition);
      text-align: left;
      font: inherit;
    }

    .scope-selector:hover {
      background: var(--accent-softer);
      border-color: rgba(0,113,227,0.22);
      transform: translateY(-1px);
    }

    .scope-selector:active { transform: translateY(0) scale(0.99); }

    .scope-selector.open {
      background: var(--accent-softer);
      border-color: rgba(0,113,227,0.28);
    }

    .scope-selector-icon {
      font-size: 1rem;
      width: 22px;
      text-align: center;
      flex-shrink: 0;
      filter: saturate(0.8);
    }

    .scope-selector-text {
      flex: 1;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .scope-selector-caret {
      font-size: 0.78rem;
      color: var(--text-tertiary);
      transition: transform var(--transition);
      flex-shrink: 0;
    }

    .scope-selector.open .scope-selector-caret { transform: rotate(180deg); }

    /* 抽题范围下拉菜单：相对选择器 wrapper 定位，正下方、全宽 */
    .scope-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      width: 100%;
      background: var(--card-bg);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      padding: 6px 0;
      max-height: 360px;
      overflow-y: auto;
      z-index: 200;
      border: 0.5px solid rgba(0,0,0,0.05);
      text-align: left;
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity 180ms cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  transform 180ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .scope-menu.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* .scope-item / .scope-separator / .scope-empty / .scope-section-label
       见下方「旧 .scope-menu 样式已迁移」段（约 640 行）。此处只定义容器 .scope-menu 本身。 */

    /* ─── Challenge · 题目区域 ─── */
    .challenge-section { position: relative; }

    /* 题目区域：从单层 slot 改为更"舞台感"的容器 */
    .slot-wrap {
      position: relative;
      min-height: 188px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 6px 0 4px;
      padding: 28px 18px;
      border-radius: var(--radius-lg);
      background: linear-gradient(180deg, rgba(0,113,227,0.025) 0%, rgba(0,0,0,0.012) 100%);
      border: 1px solid var(--border-soft);
      overflow: hidden;
      will-change: background, border-color, transform, box-shadow;
      transition: background var(--transition), border-color var(--transition), transform 200ms ease, box-shadow 200ms ease;
    }

    /* 核心交互热区：默认 hover 提示用户"这是个可点击的盒子" */
    .slot-wrap.slot-hotzone {
      cursor: pointer;
      font: inherit;
      color: inherit;
      text-align: center;
      width: 100%;
    }
    .slot-wrap.slot-hotzone:not(.spinning):not(:disabled):hover {
      background: linear-gradient(180deg, rgba(0,113,227,0.06) 0%, rgba(0,113,227,0.02) 100%);
      border-color: rgba(0,113,227,0.32);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(0,113,227,0.08);
    }
    .slot-wrap.slot-hotzone:not(.spinning):not(:disabled):active {
      transform: translateY(0) scale(0.995);
    }
    .slot-wrap.slot-hotzone:focus-visible {
      outline: none;
      border-color: rgba(0,113,227,0.45);
      box-shadow: 0 0 0 4px rgba(0,113,227,0.12);
    }

    .slot-wrap.spinning {
      background: linear-gradient(180deg, rgba(0,113,227,0.07) 0%, rgba(0,113,227,0.03) 100%);
      border-color: rgba(0,113,227,0.22);
    }

    /* 默认显示的"点击抽取"小角标 */
    .slot-cta {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--accent);
      background: rgba(0,113,227,0.08);
      padding: 4px 9px;
      border-radius: 999px;
      opacity: 0;
      transform: translateY(-2px);
      transition: opacity 200ms ease, transform 200ms ease;
      pointer-events: none;
    }
    .slot-wrap.slot-hotzone:not(.spinning):hover .slot-cta,
    .slot-wrap.slot-hotzone:not(.spinning):focus-visible .slot-cta {
      opacity: 1;
      transform: translateY(0);
    }
    /* 已抽到题后角标隐藏 */
    .slot-wrap[data-has-topic="1"] .slot-cta { display: none; }

    .slot-layer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
      opacity: 0;
      will-change: opacity, transform;
      transform: translateY(0);
      pointer-events: none;
      transition: opacity 0.08s ease, transform 0.08s ease;
    }

    .slot-layer.visible { opacity: 1; }

    .topic {
      font-size: clamp(2.0rem, 4.6vw, 2.9rem);
      font-weight: 700;
      line-height: 1.35;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      transform: translateZ(0);
      transition: opacity 240ms ease, transform 260ms cubic-bezier(0.34, 1.4, 0.64, 1);
    }

    .topic.empty {
      font-size: 1.02rem;
      font-weight: 500;
      color: var(--text-tertiary);
      line-height: 1.7;
    }

    /* 抽中揭晓动画：克制、轻量、ease-out */
    .topic.land {
      animation: topicLand 0.32s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes topicLand {
      0%   { transform: scale(0.96) translateZ(0); opacity: 0; }
      100% { transform: scale(1)    translateZ(0); opacity: 1; }
    }

    /* 揭晓瞬间给题目区域一个非常短暂的高光边框（400ms 后自动消失） */
    .slot-wrap.reveal {
      animation: revealGlow 0.4s ease-out;
    }
    @keyframes revealGlow {
      0%   { border-color: rgba(0,113,227,0); box-shadow: 0 0 0 0 rgba(0,113,227,0); }
      35%  { border-color: rgba(0,113,227,0.45); box-shadow: 0 0 0 6px rgba(0,113,227,0.10); }
      100% { border-color: var(--border-soft); box-shadow: 0 0 0 0 rgba(0,113,227,0); }
    }

    /* Ben 的状态副文案 */
    .slot-hint {
      display: block;
      text-align: center;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-tertiary);
      letter-spacing: 0.02em;
      min-height: 18px;
      margin-top: 6px;
      transition: opacity 300ms ease;
    }

    .topic.empty {
      display: none;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      align-self: center;
      opacity: 0.85;
    }

    .topic-tag.show { display: inline-block; }
    .topic-tag.ungrouped,
    .topic-tag.group {
      color: var(--accent);
      background: var(--accent-soft);
    }

    /* ─── Status Strip（动态状态提示） ─── */
    .status-strip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: center;
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      background: rgba(0,0,0,0.04);
      color: var(--text-tertiary);
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      transition: background 320ms ease, color 320ms ease;
      will-change: background, color;
    }

    .status-icon {
      font-size: 0.95rem;
      line-height: 1;
      display: inline-flex;
      transition: transform 320ms ease;
    }

    .status-strip[data-state="idle"] {
      background: rgba(0,0,0,0.04);
      color: var(--text-tertiary);
    }

    .status-strip[data-state="spinning"] {
      background: var(--accent-softer);
      color: var(--accent);
    }

    .status-strip[data-state="ready"] {
      background: rgba(52, 199, 89, 0.12);
      color: #1f9e4f;
    }
    .status-strip[data-state="ready"] .status-icon { transform: scale(1.05); }

    .status-strip[data-state="running"] {
      background: rgba(52, 199, 89, 0.10);
      color: #1f9e4f;
    }

    .status-strip[data-state="paused"] {
      background: rgba(255, 159, 10, 0.12);
      color: #b35a00;
    }
    .status-strip[data-state="done"] {
      background: rgba(52, 199, 89, 0.14);
      color: #1f9e4f;
    }

    /* ─── Duration & Timer ─── */
    .duration-presets {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .duration-chip {
      flex: 1 1 auto;
      min-width: 60px;
      background: var(--bg-soft);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-pill);
      padding: 9px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
      letter-spacing: -0.01em;
    }

    .duration-chip:hover {
      background: var(--accent-softer);
      border-color: rgba(0,113,227,0.22);
      color: var(--accent);
      transform: translateY(-1px);
    }

    .duration-chip:active { transform: translateY(0) scale(0.98); }

    .duration-chip:disabled,
    .duration-chip.locked {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }
    .duration-chip:disabled:hover,
    .duration-chip.locked:hover {
      background: var(--bg-soft);
      border-color: var(--border-soft);
      color: var(--text-secondary);
      transform: none;
    }

    .duration-chip.active {
      background: linear-gradient(135deg, var(--accent) 0%, #5856d6 100%);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 2px 8px rgba(0, 113, 227, 0.28);
    }

    .custom-duration {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 10px 4px 2px;
      border-radius: var(--radius-md);
      background: var(--bg-softer);
      border: 1px solid var(--border-soft);
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      padding-top: 0;
      padding-bottom: 0;
      margin-top: 0;
      transition: max-height 220ms cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  opacity 200ms ease,
                  padding 220ms ease,
                  margin-top 220ms ease;
    }

    .custom-duration.show {
      display: flex;
      max-height: 220px;
      opacity: 1;
      padding-top: 14px;
      padding-bottom: 6px;
      margin-top: 2px;
    }

    .custom-duration-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
    }

    .custom-duration-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .custom-duration-field {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .time-sep {
      font-size: 1.4rem;
      color: var(--text-tertiary);
      font-weight: 300;
      margin-top: -14px;
      font-variant-numeric: tabular-nums;
    }

    .custom-duration-unit {
      font-size: 0.7rem;
      color: var(--text-tertiary);
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .time-input {
      background: rgba(0,0,0,0.04);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      padding: 8px 4px;
      font-size: 1.1rem;
      width: 64px;
      text-align: center;
      outline: none;
      font-weight: 600;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
      font-variant-numeric: tabular-nums;
      -moz-appearance: textfield;
    }

    .time-input::-webkit-outer-spin-button,
    .time-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .time-input:focus {
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(0,113,227,0.12);
    }

    .time-input:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-confirm-time {
      background: linear-gradient(135deg, var(--accent) 0%, #5856d6 100%);
      color: #fff;
      border: none;
      border-radius: var(--radius-pill);
      padding: 7px 22px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      letter-spacing: -0.01em;
      box-shadow: 0 2px 6px rgba(0,113,227,0.2);
    }

    .btn-confirm-time:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0,113,227,0.32);
      filter: brightness(1.05);
    }
    .btn-confirm-time:active:not(:disabled) { transform: translateY(0) scale(0.97); }
    .btn-confirm-time:disabled { opacity: 0.5; cursor: not-allowed; }

    .custom-duration-error {
      min-height: 14px;
      font-size: 0.72rem;
      color: #d92f20;
      font-weight: 500;
      letter-spacing: 0.02em;
      transition: opacity 200ms ease;
    }

    .timer-display {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 10px;
      padding: 4px 0 0;
    }

    .timer {
      font-size: 2.4rem;
      font-weight: 200;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      color: var(--text-tertiary);
      transition: color var(--transition);
      line-height: 1;
    }

    .timer.running { color: var(--text-primary); }
    .timer.done    { color: #1f9e4f; animation: timerPulse 1.2s ease-in-out infinite; }

    @keyframes timerPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .timer-sub {
      font-size: 0.78rem;
      color: var(--text-tertiary);
      font-weight: 500;
      letter-spacing: 0.06em;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(0,0,0,0.05);
      border-radius: var(--radius-pill);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #5856d6);
      border-radius: var(--radius-pill);
      width: 0%;
      transition: width 0.6s linear, background 0.5s ease;
    }

    .progress-fill.almost { background: linear-gradient(90deg, #ff9f0a, #ff3b30); }
    .progress-fill.done    { background: linear-gradient(90deg, #34c759, #30d158); }

    /* ─── Primary Actions ─── */
    .primary-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 4px 0 0;
    }

    .btn-primary {
      width: 100%;
      border: none;
      border-radius: var(--radius-md);
      padding: 16px 28px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.005em;
      color: #fff;
      background: linear-gradient(135deg, var(--accent) 0%, #5856d6 100%);
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(67, 97, 238, 0.25);
      transition: transform 200ms ease, box-shadow 200ms ease, filter 200ms ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(67, 97, 238, 0.32);
      filter: brightness(1.04);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0) scale(0.98);
    }

    .btn-primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-primary-icon { font-size: 0.95rem; line-height: 1; }

    .btn-link {
      background: transparent;
      border: none;
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-tertiary);
      cursor: pointer;
      transition: all var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: var(--radius-pill);
    }

    .btn-link:hover { color: var(--accent); background: var(--accent-softer); }
    .btn-link:active { transform: scale(0.97); }
    .btn-link.dimmed { opacity: 0.35; pointer-events: none; }

    .btn-link-icon { font-size: 0.95rem; line-height: 1; }

    /* ─── Scope Selector（抽题范围） ─── */
    .scope-label {
      font-size: 0.78rem;
      color: var(--text-secondary);
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    /* 旧 .scope-menu 样式已迁移到 240 段附近（与 .scope-selector 同区）。此处仅保留菜单项 / 分隔条 / 空态。 */

    .scope-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      font-size: 0.9rem;
      color: var(--text-primary);
      cursor: pointer;
      transition: background var(--transition-fast);
      user-select: none;
    }

    .scope-item:hover { background: var(--accent-soft); }
    .scope-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .scope-item .scope-check { width: 14px; color: var(--accent); flex-shrink: 0; }
    .scope-item .scope-name { flex: 1; }
    .scope-item .scope-count {
      font-size: 0.78rem;
      color: var(--text-tertiary);
      flex-shrink: 0;
      padding: 1px 8px;
      background: var(--bg-soft);
      border-radius: var(--radius-pill);
    }
    .scope-item.active .scope-count {
      color: var(--accent);
      background: rgba(0,113,227,0.1);
    }

    .scope-separator {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    .scope-section-label {
      padding: 5px 16px;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-tertiary);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .scope-empty {
      padding: 14px 16px;
      font-size: 0.82rem;
      color: var(--text-tertiary);
      text-align: center;
    }

    /* ─── Draw Zone (removed: 抽题按钮已整合为热区 slot-hotzone) ─── */
    /* ─── Footer Sign ─── */
    .footer-sign {
      width: 100%;
      max-width: 680px;
      margin: 28px 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .footer-divider {
      width: 40px;
      height: 1px;
      background: var(--border-soft);
      margin-bottom: 2px;
    }

    .footer-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .footer-mark {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0.65;
    }

    .footer-tagline {
      font-size: 0.75rem;
      color: var(--text-tertiary);
      letter-spacing: 0.02em;
      line-height: 1.5;
      margin: 0;
      text-align: center;
    }

    /* ─── Modal ─── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(8px) saturate(1.2);
      -webkit-backdrop-filter: blur(8px) saturate(1.2);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 20px;
      width: 100%;
      max-width: 600px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 80px rgba(0,0,0,0.18), 0 0 0 0.5px rgba(0,0,0,0.05);
      overflow: hidden;
      animation: modalIn 0.3s cubic-bezier(0.34, 1.2, 0.64, 1) forwards;
    }

    @keyframes modalIn {
      from { transform: scale(0.94) translateY(16px); opacity: 0; }
      to   { transform: scale(1) translateY(0); opacity: 1; }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 26px 18px;
      border-bottom: 0.5px solid rgba(0,0,0,0.07);
      flex-shrink: 0;
    }

    .modal-header h2 { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); }

    .modal-close {
      background: rgba(0,0,0,0.05);
      border: none;
      color: var(--text-secondary);
      width: 32px;
      height: 32px;
      border-radius: 10px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .modal-close:hover { background: rgba(0,0,0,0.1); color: var(--text-primary); }

    .modal-toolbar {
      padding: 14px 26px;
      border-bottom: 0.5px solid rgba(0,0,0,0.07);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .toolbar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .select-all-label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
    }

    .select-all-label input { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }

    .btn-sm {
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-danger {
      background: rgba(255, 59, 48, 0.1);
      color: #ff3b30;
      border: 1.5px solid rgba(255, 59, 48, 0.2);
    }

    .btn-danger:hover { background: rgba(255, 59, 48, 0.18); color: #d92f20; }
    .btn-danger:disabled { opacity: 0.3; cursor: not-allowed; }

    .btn-upload {
      background: rgba(0,0,0,0.04);
      color: var(--text-secondary);
      border: 1.5px solid rgba(0,0,0,0.08);
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-upload:hover { background: rgba(0,0,0,0.08); color: var(--text-primary); }

    .btn-add {
      background: rgba(0,113,227,0.1);
      color: var(--accent);
      border: 1.5px solid rgba(0,113,227,0.25);
      white-space: nowrap;
    }

    .btn-add:hover { background: rgba(0,113,227,0.18); color: var(--accent-hover); }

    .btn-ghost {
      background: rgba(0,113,227,0.07);
      color: var(--accent);
      border: 1.5px solid rgba(0,113,227,0.18);
      white-space: nowrap;
    }
    .btn-ghost:hover:not(:disabled) { background: rgba(0,113,227,0.14); }
    .btn-ghost:disabled { opacity: 0.35; cursor: not-allowed; }

    /* 小型弹窗（分组输入/选择） */
    .mini-modal {
      max-width: 380px;
      max-height: none;
    }
    .mini-modal .modal-toolbar { padding: 16px 22px 18px; }
    .mini-modal .field-input { width: 100%; min-width: 0; }

    .field-input, .field-select {
      background: rgba(0,0,0,0.04);
      border: 1.5px solid rgba(0,0,0,0.09);
      border-radius: 8px;
      color: var(--text-primary);
      padding: 8px 12px;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .field-input { flex: 1; min-width: 140px; }
    .field-input:focus, .field-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,113,227,0.08);
    }
    .field-select { cursor: pointer; }

    .modal-count { font-size: 0.78rem; color: var(--text-tertiary); margin-left: auto; }

    .modal-body {
      overflow-y: auto;
      padding: 16px 26px 24px;
      flex: 1;
    }

    .modal-group { margin-bottom: 20px; }
    .modal-group:last-child { margin-bottom: 0; }

    .modal-group-title {
      font-size: 0.86rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      margin-bottom: 8px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(0,0,0,0.025);
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease;
      border-bottom: 1px solid rgba(0,0,0,0.04);
    }

    .modal-group-title:hover { background: rgba(0,113,227,0.05); }

    /* 未分组 单独区分（中性格） */
    .modal-group-title.ungrouped {
      background: rgba(0,0,0,0.025);
      color: var(--text-secondary);
    }

    /* 用户自定义分组：浅蓝高亮底 + 蓝色字 */
    .modal-group-title.group {
      background: rgba(0,113,227,0.06);
      color: var(--accent);
    }

    /* 折叠箭头 */
    .group-caret {
      display: inline-block;
      width: 14px;
      font-size: 0.72rem;
      color: var(--text-tertiary);
      transition: transform 0.22s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      flex-shrink: 0;
    }

    .modal-group-title.group .group-caret { color: var(--accent); }
    .modal-group.collapsed .group-caret { transform: rotate(-90deg); }
    .modal-group.collapsed .group-body { display: none; }

    /* 折叠动画容器 */
    .group-body {
      overflow: hidden;
      max-height: 4000px;
      opacity: 1;
      transform: translateY(0);
      transition: max-height 0.26s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  opacity 0.22s ease,
                  transform 0.22s ease;
      will-change: max-height, opacity;
    }

    .modal-group.collapsed .group-body {
      max-height: 0;
      opacity: 0;
      transform: translateY(-4px);
    }

    /* 分组标题右侧操作按钮 */
    .group-actions {
      margin-left: auto;
      display: inline-flex;
      gap: 4px;
    }

    .group-actions .btn-icon {
      width: 26px; height: 26px;
      font-size: 0.78rem;
      border-radius: 7px;
      background: rgba(255,255,255,0.85);
    }

    .modal-group-title.group .group-actions .btn-icon {
      background: rgba(255,255,255,0.9);
    }

    .topic-list { list-style: none; display: flex; flex-direction: column; gap: 5px; padding: 4px 2px 0; }

    .group-empty-hint {
      font-size: 0.78rem;
      color: var(--text-tertiary);
      padding: 6px 12px;
      font-style: italic;
    }

    .topic-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.02);
      border: 1.5px solid rgba(0,0,0,0.05);
      border-radius: 10px;
      padding: 9px 12px;
      transition: all 0.15s;
    }

    .topic-row:hover { background: rgba(0,113,227,0.04); border-color: rgba(0,113,227,0.12); }
    .topic-row.active { border-color: rgba(0,113,227,0.3); background: rgba(0,113,227,0.06); }
    .topic-row.selected { border-color: rgba(255,59,48,0.2); background: rgba(255,59,48,0.04); }

    .topic-check { width: 16px; height: 16px; flex-shrink: 0; cursor: pointer; accent-color: var(--accent); }

    .topic-text {
      flex: 1;
      font-size: 0.88rem;
      color: var(--text-secondary);
      text-align: left;
      cursor: pointer;
      line-height: 1.5;
      word-break: break-word;
    }

    .topic-text:hover { color: var(--text-primary); }

    .topic-edit-input {
      flex: 1;
      background: rgba(0,113,227,0.07);
      border: 1.5px solid rgba(0,113,227,0.35);
      border-radius: 6px;
      color: var(--text-primary);
      padding: 6px 8px;
      font-size: 0.88rem;
      outline: none;
    }

    .btn-icon {
      background: rgba(0,0,0,0.05);
      border: none;
      color: var(--text-tertiary);
      width: 28px;
      height: 28px;
      border-radius: 7px;
      font-size: 0.85rem;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon:hover { background: rgba(0,0,0,0.1); color: var(--text-primary); }
    .btn-icon.save   { color: #34c759; }
    .btn-icon.cancel { color: #ff3b30; }

    /* ─── Toast ─── */
    .toast {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(29, 29, 31, 0.88);
      color: #fff;
      padding: 11px 24px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 200;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      letter-spacing: 0.01em;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ─── Responsive ─── */
    /* ─── Responsive · 手机/平板 (≤768px) ─── */
    @media (max-width: 768px) {
      /* 全局：去掉 max-width 限制，让主体直接撑满 90% */
      body {
        padding: 0 5vw 40px;        /* 左右各 5vw，主体卡片占满 90vw */
      }

      .header { width: 90vw; padding: 18px 0 4px; }
      .brand-title { font-size: 1.25rem; }
      .brand-mark   { font-size: 1.15rem; }
      .brand-tagline { font-size: 0.74rem; }

      /* 主体卡片占满屏幕宽度 */
      .card {
        width: 90vw;
        max-width: none;
        border-radius: 20px;
        box-shadow: 0 6px 24px rgba(0,0,0,0.06);
      }

      .card-section           { padding: 18px 18px 20px; }
      .card-section.scope-section,
      .card-section.duration-section { padding: 16px 18px 18px; }
      .card-section.challenge-section { padding: 20px 18px 16px; }
      .card-divider { margin: 0 14px; }

      .section-label { font-size: 0.74rem; margin-bottom: 8px; }

      /* 热区：略微缩小，保证一行 placeholder 不溢出 */
      .slot-wrap {
        padding: 24px 16px;
        min-height: 160px;
        margin: 4px 0 2px;
      }
      .slot-wrap .topic { font-size: clamp(1.4rem, 5.8vw, 2rem); }
      .slot-wrap .topic.empty { font-size: 0.92rem; line-height: 1.55; }
      .slot-cta { font-size: 0.65rem; padding: 3px 8px; top: 10px; right: 10px; }

      /* 状态条 */
      .status-strip { font-size: 0.78rem; padding: 7px 14px; }

      /* 时长胶囊组：换行（flex-wrap），按钮可点击区域更大 */
      .duration-presets {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: space-between;
      }
      .duration-chip {
        flex: 1 1 calc(33% - 8px);   /* 一行 3 个，最少占 1/3 宽 */
        min-width: 60px;
        min-height: 40px;             /* 提升移动端可点击区域 */
        padding: 9px 8px;
        font-size: 0.82rem;
        white-space: nowrap;
      }

      /* 自定义时间面板 */
      .custom-duration-title { font-size: 0.78rem; }
      .time-input { width: 48px; font-size: 1rem; }
      .custom-duration-unit { font-size: 0.72rem; }
      .btn-confirm-time { padding: 10px 18px; font-size: 0.85rem; }

      /* 倒计时字号适当缩放 */
      .timer-display { padding: 4px 0 2px; }
      .timer { font-size: 3.4rem; letter-spacing: -0.02em; }
      .timer-sub { font-size: 0.72rem; }

      /* 主操作按钮：移动端大尺寸易点击 */
      .btn-primary {
        padding: 16px 22px;
        font-size: 1.02rem;
        min-height: 52px;            /* Apple 推荐 44pt 起步，给到 52 */
        letter-spacing: 0.01em;
      }
      .btn-link { padding: 8px 14px; font-size: 0.85rem; min-height: 36px; }

      /* scope 选择器 */
      .scope-selector { padding: 8px 14px; font-size: 0.85rem; }
      .scope-selector-icon { font-size: 0.95rem; }

      /* 话题库按钮 */
      .btn-library { padding: 7px 14px; font-size: 0.8rem; }

      /* 底部签名 */
      .footer-sign { width: 90vw; margin-top: 22px; }
      .footer-mark { font-size: 0.7rem; letter-spacing: 0.06em; }
      .footer-tagline { font-size: 0.72rem; }

      /* 挑战记录占位 */
      .challenge-record { width: 90vw; }
    }

    /* ─── Responsive · 小屏手机 (≤480px) ─── */
    @media (max-width: 480px) {
      body { padding: 0 4vw 32px; }
      .header { width: 92vw; }
      .card { width: 92vw; border-radius: 18px; }
      .card-section { padding: 16px 14px 18px; }

      .slot-wrap { min-height: 144px; padding: 20px 14px; }
      .slot-wrap .topic { font-size: clamp(1.2rem, 6vw, 1.6rem); }
      .slot-wrap .topic.empty { font-size: 0.86rem; }

      .timer { font-size: 3rem; }

      /* 超窄屏：时长胶囊一行 2 个 */
      .duration-presets { gap: 6px; }
      .duration-chip { flex: 1 1 calc(50% - 6px); }

      .btn-primary { font-size: 0.98rem; min-height: 50px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-brand">
      <span class="brand-mark">B.</span>
      <div class="brand-wordmark">
        <div class="brand-title">表达力<em>训练</em></div>
        <p class="brand-tagline">今天，试着把一个问题讲清楚。</p>
      </div>
    </div>
    <button class="btn-library" id="btnLibrary">话题库</button>
  </div>

  <div class="card" id="trainCard">
    <!-- 区 1：当前训练范围 -->
    <section class="card-section scope-section">
      <span class="section-label">当前训练范围</span>
      <div class="scope-selector-wrap">
        <button class="scope-selector" id="scopePill" type="button">
          <span class="scope-selector-icon">🎯</span>
          <span class="scope-selector-text" id="scopePillText">全部挑战</span>
          <span class="scope-selector-caret">▾</span>
        </button>
        <!-- 抽题范围下拉菜单：贴在选择器正下方、宽度匹配 -->
        <div class="scope-menu" id="scopeMenu"></div>
      </div>
    </section>

    <div class="card-divider"></div>

    <!-- 区 2：当前挑战（核心交互热区） -->
    <section class="card-section challenge-section">
      <span class="section-label">当前挑战</span>
      <span class="topic-tag" id="tag"></span>

      <button class="slot-wrap slot-hotzone" id="slotWrap" type="button" aria-label="点击或按空格抽取今日挑战">
        <div class="slot-layer visible" id="slotA"><div class="topic empty">点击此处或按下键盘 <kbd>Space</kbd> 抽取今日题目</div></div>
        <div class="slot-layer" id="slotB"><div class="topic empty"></div></div>
        <span class="slot-cta" id="slotCta">点击抽取</span>
      </button>

      <!-- 状态提示条 -->
      <div class="status-strip" id="statusStrip" data-state="idle">
        <span class="status-icon" id="statusIcon">💡</span>
        <span class="status-text" id="statusText">提示：请先点击上方区域抽取题目</span>
      </div>
    </section>

    <div class="card-divider"></div>

    <!-- 区 3：训练时长 + 开始 -->
    <section class="card-section duration-section">
      <span class="section-label">训练时长</span>
      <div class="duration-presets" id="durationPresets">
        <button class="duration-chip" data-min="1" type="button">1分钟</button>
        <button class="duration-chip" data-min="3" type="button">3分钟</button>
        <button class="duration-chip" data-min="5" type="button">5分钟</button>
        <button class="duration-chip" data-min="10" type="button">10分钟</button>
        <button class="duration-chip" data-min="custom" id="durationCustomChip" type="button">自定义</button>
      </div>
      <div class="custom-duration" id="customDurationWrap">
        <div class="custom-duration-title">自定义训练时间</div>
        <div class="custom-duration-row">
          <div class="custom-duration-field">
            <input class="time-input" id="timeInputH" type="number" inputmode="numeric" min="0" max="99" value="00" aria-label="小时">

    /* ─── Audio · 预热 + 柔和音 ─── */
    let audioReady = false;

    function getAudioCtx() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {}
      }
      return audioCtx;
    }

    /**
     * 用户首次手势后预热 AudioContext + 静音播放一段
     * 后续音效可零延迟触发，避免首次卡顿
     */
    function warmUpAudio() {
      const ctx = getAudioCtx();
      if (!ctx || audioReady) return;
      try {
        if (ctx.state === 'suspended') ctx.resume();
        // 静音 warm-up：构造一个极短、几乎听不见的 oscillator
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = 220;
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.01);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.02);
        audioReady = true;
      } catch (_) {}
    }

    // 任何用户手势都触发一次预热
    ['touchstart', 'mousedown', 'keydown'].forEach(function (evt) {
      window.addEventListener(evt, warmUpAudio, { once: true, passive: true });
    });

    /**
     * 柔和敲击音：木质 tock，三角波 380→120 Hz
     * 限频：高频段音量降到 60% 避免刺耳
     */
    function playClick(vol = 0.16, pitchScale = 1) {
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(380 * pitchScale, now);
        osc.frequency.exponentialRampToValueAtTime(120 * pitchScale, now + 0.06);
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.1);
      } catch (_) {}
    }

    /**
     * 揭晓音：柔和的 "pop"
     *   - 一个 350 → 180 Hz 的快速滑落三角波
     *   - 短促包络（80ms），音量克制
     */
    function playRevealSound() {
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(220, now + 0.18);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.16, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
        osc.start(now);
        osc.stop(now + 0.35);
      } catch (_) {}
    }

    /**
     * 开箱音：钟声和弦 C-E-G + 轻微谐波，不刺耳
     */
    function playOpenSound() {
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        // 主音：C-E-G 大三和弦
        [261.63, 329.63, 392.00].forEach(function (freq, i) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0, now + i * 0.08);
          gain.gain.linearRampToValueAtTime(0.18, now + i * 0.08 + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.5);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.55);
        });
        // 高谐波（音量低），增加钟质感
        [523.25, 659.25].forEach(function (freq, i) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0, now + 0.06 + i * 0.08);
          gain.gain.linearRampToValueAtTime(0.06, now + 0.06 + i * 0.08 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06 + i * 0.08 + 0.28);
          osc.start(now + 0.06 + i * 0.08);
          osc.stop(now + 0.06 + i * 0.08 + 0.32);
        });
      } catch (_) {}
    }

    /**
     * 计时结束音：柔和双音 C-G
     */
    function playBeep() {
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;

    }
